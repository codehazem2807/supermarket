<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B2C4D">
<title>الوردية والدرج — رفاد</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script src="config.js"></script>
<script src="theme-manager.js"></script>
<script src="settings-manager.js"></script>
<script src="app.js"></script>
<script src="theme.js"></script>

<style>
:root {
  --primary:#0B2C4D; --primary-light:#1e4a73; --primary-dark:#061a2e;
  --accent:#14B8A6; --accent-dark:#0d9488; --accent-soft:rgba(20,184,166,0.1);
  --gold:#F59E0B; --gold-soft:rgba(245,158,11,0.1);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,0.1);
  --success:#10b981; --success-soft:rgba(16,185,129,0.1);
  --info:#3b82f6; --info-soft:rgba(59,130,246,0.1);
  --purple:#8b5cf6; --purple-soft:rgba(139,92,246,0.1);
  --bg:#F1F5F9; --bg-soft:#f8fafc; --bg-card:#ffffff;
  --card:#ffffff; --text:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0; --border-soft:#f1f5f9;
  --radius:14px; --radius-sm:10px; --radius-xs:8px;
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 20px rgba(11,44,77,0.08);
  --shadow-lg:0 10px 40px rgba(11,44,77,0.12);
  --font-family:'Segoe UI','Cairo',Tahoma,sans-serif;
}
[data-theme="dark"]{--bg:#0f172a;--bg-soft:#1e293b;--bg-card:#1e293b;--card:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--border:#334155;--border-soft:#1e293b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{font-family:var(--font-family);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.main{min-height:100vh}
.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-xs);gap:12px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar h1{font-size:19px;font-weight:800;white-space:nowrap}
.topbar-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn{padding:10px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;border:none;display:inline-flex;align-items:center;gap:8px;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-soft)}
.btn-ghost{background:var(--bg-soft);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg);border-color:var(--accent)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669;transform:translateY(-1px)}
.btn-warning{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold)}
.btn-warning:hover{background:var(--gold);color:#fff}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-icon{padding:9px;width:38px;height:38px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.content{padding:24px;max-width:1200px;margin:0 auto}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.card-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px}
.card-title svg{width:18px;height:18px;color:var(--accent)}
.card-body{padding:20px}

.status-banner{background:linear-gradient(135deg,var(--accent-soft),var(--purple-soft));border:1px solid var(--accent-soft);border-radius:var(--radius);padding:24px;margin-bottom:20px;text-align:center;position:relative;overflow:hidden}
.status-banner.closed{background:linear-gradient(135deg,var(--bg-soft),var(--border-soft));border-color:var(--border)}
.status-banner::before{content:'';position:absolute;top:-50px;left:-50px;width:200px;height:200px;background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none}
.status-icon{width:80px;height:80px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;position:relative}
.status-icon.open{background:var(--success-soft);color:var(--success);animation:pulse-green 2s infinite}
.status-icon.closed{background:var(--gold-soft);color:var(--gold)}
.status-icon svg{width:40px;height:40px}
@keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(16,185,129,0.4)}50%{box-shadow:0 0 0 12px rgba(16,185,129,0)}}
.status-title{font-size:22px;font-weight:900;margin-bottom:6px}
.status-sub{font-size:13px;color:var(--text-muted)}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent)}
.stat-card.success::before{background:var(--success)}
.stat-card.danger::before{background:var(--danger)}
.stat-card.info::before{background:var(--info)}
.stat-card.gold::before{background:var(--gold)}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stat-icon svg{width:18px;height:18px}
.stat-icon.blue{background:var(--info-soft);color:var(--info)}
.stat-icon.gold{background:var(--gold-soft);color:var(--gold)}
.stat-icon.green{background:var(--success-soft);color:var(--success)}
.stat-icon.red{background:var(--danger-soft);color:var(--danger)}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:800}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:600}

.form-group{margin-bottom:16px}
.form-label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.form-input,.form-select{width:100%;padding:14px 16px;background:var(--bg-soft);border:1.5px solid var(--border);border-radius:var(--radius-xs);color:var(--text);font-size:16px;font-weight:800;text-align:center;transition:all .15s;font-variant-numeric:tabular-nums}
.form-input:focus,.form-select:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 4px var(--accent-soft)}

.quick-cash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.quick-cash-btn{padding:12px 8px;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;font-size:14px;font-weight:800;color:var(--text);cursor:pointer;transition:all .15s}
.quick-cash-btn:hover{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark);transform:translateY(-1px)}

.summary-box{background:var(--bg-soft);border-radius:var(--radius-sm);padding:18px;margin-bottom:16px}
.summary-row{display:flex;justify-content:space-between;padding:8px 0;font-size:13.5px;border-bottom:1px dashed var(--border)}
.summary-row:last-child{border-bottom:none;padding-top:12px;margin-top:6px;border-top:2px solid var(--border);font-size:16px;font-weight:800}
.summary-row .label{color:var(--text-muted)}
.summary-row .value{font-weight:800;font-variant-numeric:tabular-nums}
.summary-row .value.green{color:var(--success)}
.summary-row .value.red{color:var(--danger)}
.summary-row .value.gold{color:var(--gold)}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead{background:var(--bg-soft)}
th{padding:12px 16px;text-align:right;font-size:11px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
tbody tr:hover{background:var(--bg-soft)}
tbody tr:last-child td{border-bottom:none}

.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge svg{width:11px;height:11px}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-warning{background:var(--gold-soft);color:var(--gold)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-gray{background:var(--bg-soft);color:var(--text-muted)}
.badge-purple{background:var(--purple-soft);color:var(--purple)}

.other-sessions{background:var(--info-soft);border:1px solid var(--info);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:16px;font-size:12.5px}
.other-sessions strong{color:var(--info);display:block;margin-bottom:8px;font-size:13px}
.other-session-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed var(--border);gap:10px;flex-wrap:wrap}
.other-session-row:last-child{border-bottom:none}

.action-buttons{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.action-btn{padding:14px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.action-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--accent)}
.action-btn svg{width:22px;height:22px}
.action-btn.expense{color:var(--danger)}
.action-btn.expense:hover{background:var(--danger-soft);border-color:var(--danger)}
.action-btn.withdraw{color:var(--gold)}
.action-btn.withdraw:hover{background:var(--gold-soft);border-color:var(--gold)}
.action-btn.deposit{color:var(--success)}
.action-btn.deposit:hover{background:var(--success-soft);border-color:var(--success)}
.action-btn.purchase{color:var(--info)}
.action-btn.purchase:hover{background:var(--info-soft);border-color:var(--info)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:modalIn .3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes modalIn{from{opacity:0;transform:scale(0.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.modal-header h3 svg{width:22px;height:22px;color:var(--accent)}
.modal-close{background:var(--bg-soft);border:none;color:var(--text-muted);padding:8px;border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--danger);color:white;transform:rotate(90deg)}
.modal-close svg{width:18px;height:18px}
.modal-body{padding:22px 24px}
.modal-footer{padding:18px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}

.cat-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.cat-chip{padding:8px 14px;background:var(--bg-soft);border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.cat-chip:hover{border-color:var(--accent);transform:translateY(-1px)}
.cat-chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.cat-chip svg{width:14px;height:14px}

.empty-state{padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:14px;opacity:.5}
.empty-state h3{font-size:15px;color:var(--text);margin-bottom:6px;font-weight:700}

.loading-state{padding:60px;text-align:center;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}

.toast-container{position:fixed;top:20px;left:20px;z-index:3000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--border);border-right:4px solid var(--accent);padding:14px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);max-width:400px;animation:slideInToast .3s ease-out}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.success{border-right-color:var(--success)}.toast.success svg{color:var(--success)}
.toast.error{border-right-color:var(--danger)}.toast.error svg{color:var(--danger)}
.toast.info{border-right-color:var(--info)}.toast.info svg{color:var(--info)}
.toast.warning{border-right-color:var(--gold)}.toast.warning svg{color:var(--gold)}
@keyframes slideInToast{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

@media (max-width:768px){
  .content{padding:16px}
  .topbar{padding:0 16px}
  .topbar h1{font-size:16px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .quick-cash{grid-template-columns:repeat(2,1fr)}
  .action-buttons{grid-template-columns:1fr 1fr}
  .form-input,.form-select{font-size:16px}
  .modal{max-width:100%;max-height:96vh;margin-top:auto;border-radius:24px 24px 0 0}
  .modal-overlay{align-items:flex-end;padding:0}
  .modal-footer{flex-direction:column}
  .modal-footer .btn{width:100%;justify-content:center;min-height:48px}
}
</style>
</head>
<body>

<div id="refad-sidebar"></div>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <h1>الوردية والدرج</h1>
        <div class="topbar-subtitle" id="branchName">—</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="تحديث"><i data-lucide="refresh-cw"></i></button>
      <a href="pos.html" class="btn btn-ghost"><i data-lucide="arrow-right"></i>رجوع للكاشير</a>
    </div>
  </div>

  <div class="content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div>جاري التحميل...</div>
  </div>
</main>

<!-- Modal: Expense -->
<div class="modal-overlay" id="expenseModal">
  <div class="modal">
    <div class="modal-header">
      <h3><i data-lucide="receipt"></i><span>مصروف من الدرج</span></h3>
      <button class="modal-close" data-close="expenseModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">التصنيف</label>
        <div class="cat-chips" id="expCatChips">
          <button class="cat-chip active" data-cat="supplies"><i data-lucide="package"></i>مستلزمات</button>
          <button class="cat-chip" data-cat="maintenance"><i data-lucide="wrench"></i>صيانة</button>
          <button class="cat-chip" data-cat="transport"><i data-lucide="truck"></i>نقل</button>
          <button class="cat-chip" data-cat="utilities"><i data-lucide="zap"></i>مرافق</button>
          <button class="cat-chip" data-cat="other"><i data-lucide="more-horizontal"></i>أخرى</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">الوصف *</label>
        <input type="text" class="form-input" id="expDesc" placeholder="مثال: شراء أكياس بلاستيك" style="text-align:right;font-size:14px;font-weight:600">
      </div>
      <div class="form-group">
        <label class="form-label">المبلغ *</label>
        <input type="number" class="form-input" id="expAmount" placeholder="0.00" step="0.01" min="0">
        <div class="quick-cash" id="expQuickAmounts">
          <button class="quick-cash-btn" data-amt="50">50</button>
          <button class="quick-cash-btn" data-amt="100">100</button>
          <button class="quick-cash-btn" data-amt="200">200</button>
          <button class="quick-cash-btn" data-amt="500">500</button>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close="expenseModal">إلغاء</button>
      <button class="btn btn-danger" id="saveExpenseBtn"><i data-lucide="check"></i>تسجيل المصروف</button>
    </div>
  </div>
</div>

<!-- Modal: Cash Movement -->
<div class="modal-overlay" id="cashModal">
  <div class="modal">
    <div class="modal-header">
      <h3><i data-lucide="banknote"></i><span id="cashModalTitle">حركة نقدية</span></h3>
      <button class="modal-close" data-close="cashModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">نوع الحركة</label>
        <div class="cat-chips" id="cashTypeChips">
          <button class="cat-chip active" data-type="withdrawal"><i data-lucide="arrow-up-circle"></i>سحب من الدرج</button>
          <button class="cat-chip" data-type="deposit"><i data-lucide="arrow-down-circle"></i>إيداع في الدرج</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">المبلغ *</label>
        <input type="number" class="form-input" id="cashAmount" placeholder="0.00" step="0.01" min="0">
        <div class="quick-cash" id="cashQuickAmounts">
          <button class="quick-cash-btn" data-amt="50">50</button>
          <button class="quick-cash-btn" data-amt="100">100</button>
          <button class="quick-cash-btn" data-amt="200">200</button>
          <button class="quick-cash-btn" data-amt="500">500</button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">السبب / الملاحظات</label>
        <input type="text" class="form-input" id="cashDesc" placeholder="مثال: توريد للبنك" style="text-align:right;font-size:14px;font-weight:600">
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close="cashModal">إلغاء</button>
      <button class="btn btn-primary" id="saveCashBtn"><i data-lucide="check"></i>تسجيل</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
  'use strict';

  const cfg = window.REFAD_CONFIG;
  const sb = (window.Refad && window.Refad.sb) || window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  let session = null;
  let currentSession = null;
  let currentRegister = null;
  let currentWarehouse = null;
  let cashMovements = [];
  let sessionExpenses = [];
  let invoicePayments = [];

  let expenseCategory = 'supplies';
  let cashMovementType = 'withdrawal';

  const esc = (window.Refad && Refad.esc) || function(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
  const money = (window.Refad && Refad.money) || function(v){return Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م'};
  const fmtDate = (window.Refad && Refad.fmtDate) || function(d){if(!d)return'—';return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'})};
  const fmtDateTime = (window.Refad && Refad.fmtDateTime) || function(d){if(!d)return'—';return new Date(d).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})};
  const toast = (function(){
    const base = window.Refad && Refad.toast;
    if (base && typeof base === 'object') return function(t,m){(base[t]||base.info||function(){}) (m);};
    if (typeof base === 'function') return base;
    return function(type, msg) {
      const icons = {error:'alert-circle',success:'check-circle',info:'info',warning:'alert-triangle'};
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.innerHTML = '<i data-lucide="' + (icons[type]||'info') + '"></i><span>' + esc(msg) + '</span>';
      const c = document.getElementById('toastContainer');

        setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300)},3000); }

  async function loadContext() {
    try {
      const [regRes, whRes] = await Promise.all([
        sb.from('registers').select('id, name').eq('company_id', session.company_id).eq('branch_id', session.active_branch_id).eq('is_active', true).limit(1).maybeSingle(),
        sb.from('warehouses').select('id, name').eq('company_id', session.company_id).eq('branch_id', session.active_branch_id).limit(1).maybeSingle()
      ]);
      currentRegister = regRes.data;
      currentWarehouse = whRes.data;
      if (!currentWarehouse) {
        const r = await sb.from('warehouses').select('id, name').eq('company_id', session.company_id).is('deleted_at', null).limit(1).maybeSingle();
        currentWarehouse = r.data;
      }
    } catch (e) { console.warn('[Session] context:', e); }
  }

  async function loadActiveSession() {
    try {
      let query = sb.from('pos_sessions')
        .select('*')
        .eq('company_id', session.company_id)
        .eq('status', 'open');

      if (cfg.SESSION && cfg.SESSION.STAFF_BASED && session.user_id) {
        query = query.eq('cashier_id', session.user_id);
      } else {
        query = query.eq('branch_id', session.active_branch_id);
      }

      const res = await query
        .order('opened_at', { ascending: false })
        .limit(1)
        .maybeSingle();
      if (res.error) throw res.error;

      currentSession = res.data;

      if (currentSession && currentSession.register_id) {
        try {
          const { data: reg } = await sb.from('registers')
            .select('name')
            .eq('id', currentSession.register_id)
            .maybeSingle();
          if (reg) currentSession.registers = { name: reg.name };
        } catch (e) {}
      }
    } catch (e) {
      console.error('[Session] loadActiveSession:', e);
      toast('error', 'تعذر التحقق من حالة الوردية');
      currentSession = null;
      throw e;
    }
  }

  async function loadOtherSessions() {
    try {
      if (!session || !session.company_id) return [];

      let query = sb.from('pos_sessions')
        .select('id, opened_at, cashier_id, register_id')
        .eq('company_id', session.company_id)
        .eq('branch_id', session.active_branch_id)
        .eq('status', 'open');

      if (session.user_id) {
        query = query.neq('cashier_id', session.user_id);
      }

      const { data, error } = await query.order('opened_at', { ascending: false });
      if (error) throw error;

      const sessions = data || [];

      for (const os of sessions) {
        if (os.cashier_id) {
          try {
            const { data: u } = await sb.from('users')
              .select('full_name')
              .eq('id', os.cashier_id)
              .maybeSingle();
            if (u) os.users = { full_name: u.full_name };
          } catch (e) {}
        }
        if (os.register_id) {
          try {
            const { data: r } = await sb.from('registers')
              .select('name')
              .eq('id', os.register_id)
              .maybeSingle();
            if (r) os.registers = { name: r.name };
          } catch (e) {}
        }
      }

      return sessions;
    } catch (e) {
      console.warn('[Session] loadOtherSessions:', e);
      return [];
    }
  }

  async function loadSessionSummary() {

  async function loadInvoices() {

    try {

  async function loadInvoicePayments(invoices) {
    const invoiceIds = invoices.map(invoice => invoice.id);
    if (invoiceIds.length === 0) {
      invoicePayments = [];
      return;
    }

    const { data, error } = await sb.from('invoice_payments')
      .select('invoice_id, payment_method, amount')
      .in('invoice_id', invoiceIds);
    if (error) {
      console.error('[Session] loadInvoicePayments:', error);
      toast('error', 'تعذر تحميل تفاصيل الدفعات المختلطة');

    }

  function computeCashSummary(invoices) {
    const openingCash = Number(currentSession?.opening_cash || 0);

    const saleCashMovements = cashMovements
      .filter(m => m.movement_type === 'sale' && m.direction !== 'out' && (!m.payment_method || String(m.payment_method).toLowerCase() === 'cash'))
      .reduce((s, m) => s + Number(m.amount || 0), 0);
    const cashSales = saleCashMovements;
    const creditSales = invoices.filter(i => i.payment_method === 'credit').reduce((s, i) => s + Number(i.total || 0), 0);
    const mixedInvoices = invoices.filter(i => i.payment_method === 'mixed');
    const mixedSales = 0;
    const mixedCardSales = mixedInvoices.reduce((total, invoice) => total +
      invoicePayments.filter(payment => payment.invoice_id === invoice.id && payment.payment_method === 'card')
        .reduce((sum, payment) => sum + Number(payment.amount || 0), 0), 0);
    const cardSales = invoices.filter(i => i.payment_method === 'card')
      .reduce((s, i) => s + Number(i.paid || 0), 0) + mixedCardSales;

    const withdrawals = cashMovements.filter(m => m.movement_type === 'withdrawal').reduce((s, m) => s + Number(m.amount), 0);
    const deposits = cashMovements.filter(m => m.movement_type === 'deposit').reduce((s, m) => s + Number(m.amount), 0);
    const expensesFromCash = cashMovements.filter(m => m.movement_type === 'expense').reduce((s, m) => s + Number(m.amount), 0);
    const purchasePayments = cashMovements.filter(m => m.movement_type === 'purchase_payment').reduce((s, m) => s + Number(m.amount), 0);

    const otherCashMovements = cashMovements
      .filter(m => m.movement_type !== 'sale' && (!m.payment_method || m.payment_method === 'cash'))
      .reduce((sum, movement) => sum + (movement.direction === 'in' ? 1 : -1) * Number(movement.amount || 0), 0);
    const expectedCash = openingCash + cashSales + mixedSales + otherCashMovements;

    return {
      openingCash,
      cashSales,
      cardSales,
      creditSales,
      mixedSales,
      mixedCardSales,
      withdrawals,
      deposits,
      expensesFromCash,
      purchasePayments,
      expectedCash
    };
  }

        .eq('company_id', session.company_id)
        .eq('branch_id', session.active_branch_id)
        .neq('status', 'open')
        .order('opened_at', { ascending: false })
        .limit(30);
      if (error) throw error;
      rows = data || [];
    } catch (e) {
      console.warn('[Session] history:', e);
      return;
    }

    const userIds = [...new Set(rows.flatMap(r => [r.cashier_id, r.opened_by]).filter(Boolean))];
    const regIds = [...new Set(rows.map(r => r.register_id).filter(Boolean))];
    const [usersRes, regsRes] = await Promise.all([
      userIds.length ? sb.from('users').select('id, full_name').in('id', userIds) : { data: [] },
      regIds.length ? sb.from('registers').select('id, name').in('id', regIds) : { data: [] }
    ]);
    const userMap = Object.fromEntries((usersRes.data || []).map(u => [u.id, u.full_name]));
    const regMap = Object.fromEntries((regsRes.data || []).map(r => [r.id, r.name]));

    const old = document.getElementById('sessionHistoryCard');
    if (old) old.remove();
    const card = document.createElement('div');
    card.className = 'card';
    card.id = 'sessionHistoryCard';
    card.style.marginTop = '16px';
    card.innerHTML = `
      <div class="card-header">
        <div class="card-title"><i data-lucide="history"></i><span>الورديات السابقة</span></div>
      </div>
      <div class="card-body" style="overflow-x:auto">
        ${rows.length === 0 ? '<div style="color:var(--text-muted);text-align:center;padding:16px">لا توجد ورديات سابقة</div>' : `
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead><tr style="text-align:right;color:var(--text-muted)">
            <th style="padding:8px">الكاشير</th><th>الدرج</th><th>الفتح</th><th>الإغلاق</th>
            <th>الافتتاحي</th><th>المبيعات</th><th>المرتجعات</th><th>المتوقع</th><th>المعدود</th><th>الفرق</th><th></th>
          </tr></thead>
          <tbody>
          ${rows.map(r => {
            const diff = Number(r.difference || 0);
            const diffColor = Math.abs(diff) < 0.005 ? 'var(--success)' : 'var(--danger)';
            return `
            <tr style="border-top:1px solid var(--border)">
              <td style="padding:8px">${esc(userMap[r.cashier_id || r.opened_by] || '—')}</td>
              <td>${esc(regMap[r.register_id] || '—')}</td>
              <td>${fmtDateTime(r.opened_at)}</td>
              <td>${r.closed_at ? fmtDateTime(r.closed_at) : '—'}</td>
              <td>${money(Number(r.opening_cash || 0))}</td>
              <td>${money(Number(r.total_sales || 0))}</td>
              <td>${money(Number(r.total_returns || 0))}</td>
              <td>${money(Number(r.expected_cash ?? r.closing_cash ?? 0))}</td>
              <td>${r.counted_cash == null && r.actual_cash == null ? '—' : money(Number(r.counted_cash ?? r.actual_cash ?? 0))}</td>
              <td style="color:${diffColor};font-weight:700">${money(diff)}</td>
              <td><button class="btn btn-secondary" data-session-detail="${r.id}">تفاصيل</button></td>
            </tr>
            <tr id="detail-${r.id}" style="display:none"><td colspan="11" style="padding:10px;background:var(--bg-soft)"></td></tr>`;
          }).join('')}
          </tbody>
        </table>`}
      </div>`;
    container.appendChild(card);

    card.querySelectorAll('[data-session-detail]').forEach(btn => {
      btn.onclick = () => toggleSessionDetail(btn.dataset.sessionDetail);
    });
  }

  async function toggleSessionDetail(id) {
    const row = document.getElementById('detail-' + id);
    if (!row) return;
    if (row.style.display !== 'none') { row.style.display = 'none'; return; }
    row.style.display = '';
    const cell = row.firstElementChild;
    if (cell.dataset.loaded) return;
    cell.textContent = 'جاري التحميل...';
    try {
      const [inv, mov] = await Promise.all([
        sb.from('sales_invoices').select('invoice_number, total, status, payment_method').eq('session_id', id),
        sb.from('cash_movements').select('movement_type, direction, amount, description, created_at').eq('session_id', id)
      ]);
      if (inv.error) throw inv.error;
      if (mov.error) throw mov.error;
      const invoices = (inv.data || []).filter(i => i.status !== 'voided');
      const byMethod = {};
      invoices.forEach(i => { byMethod[i.payment_method] = (byMethod[i.payment_method] || 0) + Number(i.total || 0); });
      const methodLabels = { cash: 'نقدي', card: 'بطاقة', credit: 'آجل', mixed: 'مختلط' };
      const byType = {};
      (mov.data || []).forEach(m => { byType[m.movement_type] = (byType[m.movement_type] || 0) + Number(m.amount || 0); });
      cell.innerHTML = `
        <div style="display:flex;gap:32px;flex-wrap:wrap">
          <div><strong>الفواتير (${invoices.length})</strong>
            ${Object.entries(byMethod).map(([k, v]) => `<div>${esc(methodLabels[k] || k)}: ${money(v)}</div>`).join('') || '<div>—</div>'}
          </div>
          <div><strong>حركات الدرج (${(mov.data || []).length})</strong>
            ${Object.entries(byType).map(([k, v]) => `<div>${esc(SESSION_MOVEMENT_LABELS[k] || k)}: ${money(v)}</div>`).join('') || '<div>—</div>'}
          </div>
        </div>`;
      cell.dataset.loaded = '1';
    } catch (e) {
      console.error('[Session] detail:', e);
      cell.textContent = 'تعذر تحميل التفاصيل';
    }
  }

  function openModal(id) {
    document.getElementById(id).classList.add('show');
    if (window.lucide) lucide.createIcons();
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('show');
  }

  function openExpenseModal() {
    expenseCategory = 'supplies';
    document.getElementById('expDesc').value = '';
    document.getElementById('expAmount').value = '';
    document.querySelectorAll('#expCatChips .cat-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.cat === 'supplies');
    });
    openModal('expenseModal');
  }

  function openCashModal(type) {
    cashMovementType = type;
    document.getElementById('cashModalTitle').textContent = type === 'withdrawal' ? 'سحب نقدي من الدرج' : 'إيداع نقدي في الدرج';
    document.getElementById('cashAmount').value = '';
    document.getElementById('cashDesc').value = '';
    document.querySelectorAll('#cashTypeChips .cat-chip').forEach(c => {
      c.classList.toggle('active', c.dataset.type === type);
    });
    openModal('cashModal');
  }

  async function saveExpense() {
    const desc = document.getElementById('expDesc').value.trim();
    const amount = Number(document.getElementById('expAmount').value) || 0;

    if (!desc) { toast('warning', 'الوصف مطلوب'); return; }
    if (amount <= 0) { toast('warning', 'المبلغ يجب أن يكون أكبر من 0'); return; }

    const btn = document.getElementById('saveExpenseBtn');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div><span>جاري...</span>';

    try {
      const { error } = await sb.rpc('record_cash_expense', {
        p_company: session.company_id,
        p_branch: session.active_branch_id,
        p_session: currentSession.id,
        p_category: expenseCategory,
        p_description: desc,
        p_amount: amount,
        p_expense_date: new Date().toISOString().slice(0, 10),
        p_payment_method: 'cash'
      });
      if (error) throw error;

      toast('success', 'تم تسجيل المصروف من الدرج');
      closeModal('expenseModal');
      await render();
    } catch (e) {
      console.error('[Session] saveExpense:', e);
      toast('error', 'فشل: ' + (e.message || ''));
      btn.disabled = false;
      btn.innerHTML = original;
    }
  }

  async function saveCashMovement() {
    const amount = Number(document.getElementById('cashAmount').value) || 0;
    const desc = document.getElementById('cashDesc').value.trim();

    if (amount <= 0) { toast('warning', 'المبلغ يجب أن يكون أكبر من 0'); return; }

    const btn = document.getElementById('saveCashBtn');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div><span>جاري...</span>';

    try {
      const { error } = await sb.rpc('record_cash_movement', {
        p_company: session.company_id,
        p_branch: session.active_branch_id,
        p_session: currentSession.id,
        p_movement_type: cashMovementType,
        p_amount: amount,
        p_description: desc || (cashMovementType === 'withdrawal' ? 'سحب نقدي' : 'إيداع نقدي')
      });

      if (error) throw error;

      toast('success', cashMovementType === 'withdrawal' ? 'تم السحب من الدرج' : 'تم الإيداع في الدرج');
      closeModal('cashModal');
      await render();
    } catch (e) {
      console.error('[Session] saveCashMovement:', e);
      toast('error', 'فشل: ' + (e.message || ''));
      btn.disabled = false;
      btn.innerHTML = original;
    }
  }

  async function openSession() {
    const opening = Number(document.getElementById('openingCash').value) || 0;
    const btn = document.getElementById('openSessionBtn');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div><span>جاري...</span>';

    try {
      let res = await sb.rpc('open_pos_session', {
        p_company: session.company_id,
        p_branch: session.active_branch_id,
        p_warehouse: currentWarehouse?.id || null,
        p_register: currentRegister?.id || null,
        p_opening_cash: opening,
        p_cashier_id: session.user_id
      });

      if (res.error && res.error.message && (res.error.message.indexOf('p_cashier_id') !== -1 || res.error.message.indexOf('function') !== -1)) {
        res = await sb.rpc('open_pos_session', {
          p_company: session.company_id,
          p_branch: session.active_branch_id,
          p_warehouse: currentWarehouse?.id || null,
          p_register: currentRegister?.id || null,
          p_opening_cash: opening
        });

        if (!res.error && res.data) {
          await sb.from('pos_sessions')
            .update({ cashier_id: session.user_id })
            .eq('id', res.data)
            .is('cashier_id', null);
        }
      }

      if (res.error) throw res.error;

      toast('success', 'تم فتح الوردية');
      await render();
    } catch (e) {
      console.error('[Session] openSession error:', e);
      const msg = e.message || 'خطأ';

      if (msg.indexOf('duplicate') !== -1 || msg.indexOf('uq_pos_sessions') !== -1) {
        toast('error', 'الجهاز عليه وردية مفتوحة بالفعل. جاري التحديث...');
        setTimeout(() => render(), 1500);
      } else if (msg.indexOf('cashier') !== -1 || msg.indexOf('وردية') !== -1) {
        toast('error', 'عندك وردية مفتوحة بالفعل');
        setTimeout(() => render(), 1500);
      } else {
        toast('error', 'فشل: ' + msg);
      }

      btn.disabled = false;
      btn.innerHTML = original;
    }
  }

  async function closeSession() {
    if (!currentSession) return;
    const counted = Number(document.getElementById('countedCash').value) || 0;
    if (!confirm('إغلاق الوردية؟\nالمبلغ في الدرج: ' + money(counted))) return;

    const btn = document.getElementById('closeSessionBtn');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div><span>جاري...</span>';

    try {
      const res = await sb.rpc('close_pos_session', {
        p_session: currentSession.id,
        p_counted_cash: counted
      });
      if (res.error) throw res.error;
      toast('success', 'تم إغلاق الوردية');
      await render();
    } catch (e) {
      console.error('[Session] closeSession error:', e);
      toast('error', 'فشل: ' + (e.message || 'خطأ'));
      btn.disabled = false;
      btn.innerHTML = original;
    }
  }

  async function init() {
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (user) {
        const { data: pa } = await sb.from('platform_admins')
          .select('id').eq('id', user.id).eq('is_active', true).maybeSingle();
        if (pa) { location.href = 'admin.html'; return; }
      }
    } catch (e) { console.warn('[Session] admin check failed:', e); }

    session = await (window.Refad && Refad.requireSession ? Refad.requireSession() : Promise.resolve(null));
    if (!session || !session.company_id) {
      setTimeout(() => location.href = 'index.html', 1200);
      return;
    }

    const branchNameEl = document.getElementById('branchName');
    if (branchNameEl) {
      const companyName = (window.RefadSettings && window.RefadSettings.get('general.company_name')) || session.company_name || '';
      branchNameEl.textContent = (companyName || '') + ' — ' + (session.branch_name || '—');
    }

    await loadContext();
    await render();

    document.getElementById('refreshBtn').onclick = async () => {
      toast('info', 'جاري التحديث...');
      await loadContext();
      await render();
      toast('success', 'تم التحديث');
    };

    document.querySelectorAll('[data-close]').forEach(btn => {
      btn.onclick = () => closeModal(btn.dataset.close);
    });
    document.querySelectorAll('.modal-overlay').forEach(m => {
      m.onclick = (e) => { if (e.target === m) m.classList.remove('show'); };
    });

    document.querySelectorAll('#expCatChips .cat-chip').forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll('#expCatChips .cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        expenseCategory = chip.dataset.cat;
      };
    });

    document.querySelectorAll('#cashTypeChips .cat-chip').forEach(chip => {
      chip.onclick = () => {
        document.querySelectorAll('#cashTypeChips .cat-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        cashMovementType = chip.dataset.type;
      };
    });

    document.querySelectorAll('#expQuickAmounts .quick-cash-btn').forEach(b => {
      b.onclick = () => { document.getElementById('expAmount').value = b.dataset.amt; };
    });
    document.querySelectorAll('#cashQuickAmounts .quick-cash-btn').forEach(b => {
      b.onclick = () => { document.getElementById('cashAmount').value = b.dataset.amt; };
    });

    document.getElementById('saveExpenseBtn').onclick = saveExpense;
    document.getElementById('saveCashBtn').onclick = saveCashMovement;

    window.addEventListener('refad:settings-changed', () => {
      const cName = (window.RefadSettings && window.RefadSettings.get('general.company_name')) || session.company_name;
      if (branchNameEl) branchNameEl.textContent = (cName || '') + ' — ' + (session.branch_name || '—');
    });

    if (window.lucide) lucide.createIcons();
    console.log('[Session v4.0] Ready');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();
</script>

<script src="sidebar.js"></script>

</body>
