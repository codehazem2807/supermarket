<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B2C4D">
<title>الفروع — رفاد سوبرماركت</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<!-- ⭐ ترتيب السكربتات -->
<script src="config.js"></script>
<script src="theme-manager.js"></script>
<script src="settings-manager.js"></script>
<script src="app.js"></script>
<script src="theme.js"></script>

<style>
:root {
  --primary:#0B2C4D; --primary-light:#1e4a73; --primary-dark:#061a2e;
  --accent:#14B8A6; --accent-dark:#0d9488; --accent-soft:rgba(20,184,166,0.1);
  --gold:#F59E0B; --gold-soft:rgba(245,158,11,0.1);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,0.1);
  --success:#10b981; --success-soft:rgba(16,185,129,0.1);
  --info:#3b82f6; --info-soft:rgba(59,130,246,0.1);
  --purple:#8b5cf6; --purple-soft:rgba(139,92,246,0.1);
  --bg:#F1F5F9; --bg-soft:#f8fafc; --bg-card:#ffffff;
  --card:#ffffff;
  --text:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0; --border-soft:#f1f5f9;
  --radius:14px; --radius-sm:10px; --radius-xs:8px;
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 20px rgba(11,44,77,0.08);
  --shadow-lg:0 10px 40px rgba(11,44,77,0.12);
  --font-family:'Segoe UI',Tahoma,sans-serif;
}
[data-theme="dark"]{--bg:#0f172a;--bg-soft:#1e293b;--bg-card:#1e293b;--card:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--border:#334155;--border-soft:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  font-family:var(--font-family);
  background:var(--bg);color:var(--text);
  min-height:100vh;font-size:14px;
  -webkit-font-smoothing:antialiased;
  transition:background 0.2s,color 0.2s;
}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.main{min-height:100vh}
.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-xs);gap:12px}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar h1{font-size:19px;font-weight:800;white-space:nowrap}
.topbar-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn{padding:10px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;border:none;display:inline-flex;align-items:center;gap:8px;transition:all 0.15s;white-space:nowrap;text-decoration:none}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:white}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-soft)}
.btn-ghost{background:var(--bg-soft);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg);border-color:var(--accent)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:white}
.btn-warning{background:var(--gold-soft);color:var(--gold)}
.btn-warning:hover{background:var(--gold);color:white}
.btn-success{background:var(--success-soft);color:var(--success)}
.btn-success:hover{background:var(--success);color:white}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-icon{padding:9px;width:38px;height:38px;justify-content:center}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important}

.content{padding:24px;max-width:1600px}

.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent)}
.stat-card.success::before{background:var(--success)}
.stat-card.danger::before{background:var(--danger)}
.stat-card.info::before{background:var(--info)}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:6px}
.stat-value{font-size:22px;font-weight:800}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:600}

.branches-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.branch-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;transition:all 0.2s;position:relative;overflow:hidden;cursor:pointer}
.branch-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow)}
.branch-card.inactive{opacity:0.7}
.branch-card.main-branch{border-color:var(--gold);background:linear-gradient(135deg, var(--gold-soft), var(--card))}
.branch-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-dark))}
.branch-card.inactive::before{background:var(--danger)}
.branch-card.main-branch::before{background:linear-gradient(90deg,var(--gold),#d97706)}
.branch-card-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.branch-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:white;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;font-weight:800;position:relative}
.branch-icon.inactive{background:linear-gradient(135deg,#94a3b8,#64748b)}
.branch-icon.main-branch{background:linear-gradient(135deg,var(--gold),#d97706)}
.branch-icon.main-branch::after{content:'👑';position:absolute;top:-6px;right:-6px;font-size:14px}
.branch-info{flex:1;min-width:0}
.branch-name{font-size:16px;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.branch-code{font-size:11px;color:var(--text-muted);font-family:monospace}
.branch-badges{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.badge svg{width:11px;height:11px}
.badge-success{background:var(--success-soft);color:var(--success)}
.badge-danger{background:var(--danger-soft);color:var(--danger)}
.badge-warning{background:var(--gold-soft);color:var(--gold)}
.badge-info{background:var(--info-soft);color:var(--info)}
.badge-gray{background:var(--bg-soft);color:var(--text-muted)}
.branch-details{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;font-size:12.5px}
.branch-detail{display:flex;align-items:center;gap:8px;color:var(--text-muted)}
.branch-detail svg{width:14px;height:14px;flex-shrink:0}
.branch-detail strong{color:var(--text);font-weight:700}

.branch-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;padding:12px;background:var(--bg-soft);border-radius:var(--radius-xs)}
.branch-stat{text-align:center}
.branch-stat-value{font-size:18px;font-weight:800;color:var(--accent)}
.branch-stat-value.small{font-size:14px;color:var(--gold)}
.branch-stat-label{font-size:10.5px;color:var(--text-muted);font-weight:600;margin-top:2px}

.branch-actions{display:flex;gap:6px;border-top:1px solid var(--border-soft);padding-top:12px}
.branch-actions .btn{flex:1;padding:7px;font-size:11.5px;justify-content:center;min-width:0}
.branch-actions .icon-only{flex:0 0 36px;padding:7px}

/* ⭐ NEW: Branch Details Modal */
.details-tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;overflow-x:auto;background:var(--card);padding:0 24px;margin-left:-24px;margin-right:-24px;margin-top:-22px;padding-top:0}
.details-tab{padding:14px 18px;background:none;border:none;color:var(--text-muted);font-size:13px;font-weight:700;border-bottom:2px solid transparent;white-space:nowrap;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.details-tab:hover{color:var(--text)}
.details-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.details-tab svg{width:15px;height:15px}
.details-tab .count-badge{background:var(--bg-soft);color:var(--text-muted);padding:1px 6px;border-radius:8px;font-size:10px;font-weight:800}
.details-tab.active .count-badge{background:var(--accent-soft);color:var(--accent)}

.details-panel{display:none}
.details-panel.active{display:block}

.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.info-item{background:var(--bg-soft);padding:14px;border-radius:var(--radius-xs);border:1px solid var(--border)}
.info-label{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.info-value{font-size:14px;font-weight:700;word-break:break-word}
.info-value.empty{color:var(--text-muted);font-style:italic;font-weight:500}

.mini-stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:20px}
.mini-stat{background:var(--bg-soft);padding:14px;border-radius:var(--radius-xs);border:1px solid var(--border);text-align:center}
.mini-stat-icon{width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px}
.mini-stat-icon svg{width:18px;height:18px}
.mini-stat-icon.teal{background:var(--accent-soft);color:var(--accent)}
.mini-stat-icon.gold{background:var(--gold-soft);color:var(--gold)}
.mini-stat-icon.blue{background:var(--info-soft);color:var(--info)}
.mini-stat-icon.purple{background:var(--purple-soft);color:var(--purple)}
.mini-stat-icon.green{background:var(--success-soft);color:var(--success)}
.mini-stat-icon.red{background:var(--danger-soft);color:var(--danger)}
.mini-stat-value{font-size:20px;font-weight:800;line-height:1.1}
.mini-stat-label{font-size:11px;color:var(--text-muted);font-weight:600;margin-top:4px}

.details-section{background:var(--bg-soft);padding:16px;border-radius:var(--radius-xs);margin-bottom:16px;border:1px solid var(--border)}
.details-section-title{font-size:13px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:var(--text)}
.details-section-title svg{width:16px;height:16px;color:var(--accent)}
.details-section-title .count-badge{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;margin-right:auto}

.detail-list{display:flex;flex-direction:column;gap:8px}
.detail-list-item{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--card);border-radius:8px;border:1px solid var(--border);font-size:12.5px;gap:10px}
.detail-list-item:hover{background:var(--bg)}
.detail-list-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.detail-list-icon{width:32px;height:32px;border-radius:8px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.detail-list-icon svg{width:16px;height:16px}
.detail-list-info{flex:1;min-width:0}
.detail-list-name{font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail-list-meta{font-size:11px;color:var(--text-muted);font-family:monospace}
.detail-list-right{font-weight:800;color:var(--text);flex-shrink:0;text-align:left}

.detail-table{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--card);border-radius:8px;overflow:hidden}
.detail-table thead{background:var(--bg)}
.detail-table th{padding:10px 12px;text-align:right;font-size:10.5px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px;border-bottom:1px solid var(--border);white-space:nowrap}
.detail-table td{padding:10px 12px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
.detail-table tbody tr:last-child td{border-bottom:none}
.detail-table tbody tr:hover{background:var(--bg)}

.empty-details{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13px}
.empty-details svg{width:40px;height:40px;margin-bottom:10px;opacity:0.4}
.empty-details p{margin-top:4px;font-size:12px}

.details-loading{padding:40px;text-align:center;color:var(--text-muted)}
.details-loading .spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 10px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.show{display:flex}
.modal{background:var(--card);border-radius:18px;width:100%;max-width:560px;max-height:92vh;overflow-y:auto;box-shadow:var(--shadow-lg);animation:modalIn 0.25s cubic-bezier(0.4,0,0.2,1)}
.modal.xl{max-width:1100px}
@keyframes modalIn{from{opacity:0;transform:scale(0.95) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--card);z-index:1;gap:12px}
.modal-header h3{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;flex:1}
.modal-header h3 svg{width:20px;height:20px;color:var(--accent)}
.modal-close{background:none;border:none;color:var(--text-muted);padding:6px;border-radius:8px}
.modal-close:hover{background:var(--bg);color:var(--text)}
.modal-close svg{width:20px;height:20px}
.modal-body{padding:22px 24px}
.modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;background:var(--card);flex-wrap:wrap}

.form-group{margin-bottom:14px}
.form-label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.form-label .required{color:var(--danger)}
.form-input,.form-select,.form-textarea{width:100%;padding:10px 14px;background:var(--bg-soft);border:1.5px solid var(--border);border-radius:var(--radius-xs);color:var(--text);font-size:14px;transition:all 0.15s}
.form-input:focus,.form-select:focus,.form-textarea:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px var(--accent-soft)}
.form-input.error{border-color:var(--danger);background:rgba(239,68,68,0.03)}
.form-textarea{resize:vertical;min-height:60px}
.form-hint{font-size:11.5px;color:var(--text-muted);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-error{background:var(--danger-soft);color:var(--danger);padding:11px 14px;border-radius:var(--radius-xs);font-size:12.5px;font-weight:600;margin-bottom:14px;display:none;border-right:3px solid var(--danger)}
.form-error.show{display:block}
.form-check{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-xs);cursor:pointer;user-select:none;margin-bottom:14px}
.form-check:hover{background:var(--bg)}
.form-check input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.form-check-label{flex:1;font-size:13px;font-weight:600}
.form-check .badge{margin-right:auto}

.info-banner{background:var(--info-soft);border:1px solid rgba(59,130,246,0.3);border-radius:var(--radius-sm);padding:14px;margin-bottom:20px;font-size:12.5px;color:var(--info);display:flex;gap:10px;align-items:flex-start}
.info-banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}

.warning-banner{background:var(--gold-soft);border:1px solid rgba(245,158,11,0.3);border-radius:var(--radius-sm);padding:14px;margin-bottom:20px;font-size:12.5px;color:#92400e;display:flex;gap:10px;align-items:flex-start}
.warning-banner svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}

.toast-container{position:fixed;top:20px;left:20px;z-index:3000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--border);border-right:4px solid var(--accent);padding:14px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);max-width:400px;animation:slideInToast 0.3s ease-out}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.success{border-right-color:var(--success)}
.toast.success svg{color:var(--success)}
.toast.error{border-right-color:var(--danger)}
.toast.error svg{color:var(--danger)}
.toast.info{border-right-color:var(--info)}
.toast.info svg{color:var(--info)}
.toast.warning{border-right-color:var(--gold)}
.toast.warning svg{color:var(--gold)}
@keyframes slideInToast{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

.loading-state{padding:40px;text-align:center;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:14px;opacity:0.5}
.empty-state h3{font-size:15px;color:var(--text);margin-bottom:6px;font-weight:700}

@media (max-width:1024px){.refad-main-content{margin-right:0!important}}
@media (max-width:768px){
  .content{padding:16px}
  .topbar{padding:0 16px}
  .topbar h1{font-size:16px}
  .form-row{grid-template-columns:1fr}
  .branches-grid{grid-template-columns:1fr}
  .stats-grid{grid-template-columns:1fr 1fr}
  .info-grid{grid-template-columns:1fr}
  .details-tabs{padding:0 16px;margin-left:-16px;margin-right:-16px}
  .detail-table{font-size:11px}
  .detail-table th,.detail-table td{padding:8px}
}
</style>
</head>
<body>

<div id="refad-sidebar"></div>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div><h1>الفروع</h1><div class="topbar-subtitle" id="branchName">—</div></div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="تحديث"><i data-lucide="refresh-cw"></i></button>
      <button class="btn btn-primary" id="addBranchBtn"><i data-lucide="plus"></i><span>فرع جديد</span></button>
    </div>
  </div>

  <div class="content">
    <div class="info-banner" id="permissionBanner" style="display:none">
      <i data-lucide="info"></i>
      <div id="permissionBannerText"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">إجمالي الفروع</div>
        <div class="stat-value" id="statTotal">—</div>
        <div class="stat-sub" id="statTotalSub">—</div>
      </div>
      <div class="stat-card success">
        <div class="stat-label">نشطة</div>
        <div class="stat-value" id="statActive" style="color:var(--success)">—</div>
        <div class="stat-sub" id="statActiveSub">—</div>
      </div>
      <div class="stat-card danger">
        <div class="stat-label">معطلة</div>
        <div class="stat-value" id="statInactive" style="color:var(--danger)">—</div>
        <div class="stat-sub">لا يمكن البيع فيها</div>
      </div>
      <div class="stat-card info">
        <div class="stat-label">إجمالي المستخدمين</div>
        <div class="stat-value" id="statUsers" style="color:var(--info)">—</div>
        <div class="stat-sub" id="statUsersSub">موزعين على الفروع</div>
      </div>
    </div>

    <div class="branches-grid" id="branchesGrid">
      <div class="loading-state" style="grid-column:1/-1"><div class="spinner"></div>جاري التحميل...</div>
    </div>
  </div>
</main>

<!-- Branch Modal -->
<div class="modal-overlay" id="branchModal">
  <div class="modal">
    <div class="modal-header">
      <h3><i data-lucide="git-branch"></i><span id="modalTitle">فرع جديد</span></h3>
      <button class="modal-close" data-close="branchModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-error" id="branchFormError"></div>
      <input type="hidden" id="branchId">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">اسم الفرع <span class="required">*</span></label>
          <input type="text" class="form-input" id="brName" placeholder="مثال: فرع مدينة نصر" maxlength="100">
        </div>
        <div class="form-group">
          <label class="form-label">الكود</label>
          <input type="text" class="form-input" id="brCode" placeholder="BR-01" dir="ltr" maxlength="20">
          <div class="form-hint">اختياري — كود مختصر للفرع</div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">الهاتف</label>
        <input type="tel" class="form-input" id="brPhone" placeholder="01000000000" maxlength="20">
      </div>

      <div class="form-group">
        <label class="form-label">العنوان</label>
        <textarea class="form-textarea" id="brAddress" placeholder="العنوان الكامل" maxlength="200"></textarea>
      </div>

      <div class="form-check" id="isMainCheck">
        <input type="checkbox" id="brIsMain">
        <label for="brIsMain" class="form-check-label">فرع رئيسي</label>
        <span class="badge badge-warning"><i data-lucide="crown"></i>MAIN</span>
      </div>

      <div class="form-check">
        <input type="checkbox" id="brActive" checked>
        <label for="brActive" class="form-check-label">نشط (يمكن البيع فيه)</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close="branchModal">إلغاء</button>
      <button class="btn btn-primary" id="saveBranchBtn"><i data-lucide="save"></i><span>حفظ</span></button>
    </div>
  </div>
</div>

<!-- ⭐ NEW: Branch Details Modal -->
<div class="modal-overlay" id="detailsModal">
  <div class="modal xl">
    <div class="modal-header">
      <h3><i data-lucide="building-2"></i><span id="detailsTitle">تفاصيل الفرع</span></h3>
      <button class="modal-close" data-close="detailsModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body" id="detailsBody">
      <div class="details-loading"><div class="spinner"></div>جاري التحميل...</div>
    </div>
  </div>
</div>

<!-- Toggle confirmation Modal -->
<div class="modal-overlay" id="toggleModal">
  <div class="modal">
    <div class="modal-header">
      <h3 style="color:var(--gold)"><i data-lucide="alert-triangle"></i><span>تأكيد تغيير الحالة</span></h3>
      <button class="modal-close" data-close="toggleModal"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div class="warning-banner" id="toggleWarning" style="display:none">
        <i data-lucide="alert-triangle"></i>
        <div id="toggleWarningText"></div>
      </div>
      <p style="font-size:13px" id="toggleMessage"></p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" data-close="toggleModal">إلغاء</button>
      <button class="btn btn-warning" id="confirmToggleBtn"><i data-lucide="power"></i>تأكيد</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
  'use strict';

  const cfg = window.REFAD_CONFIG;
  const sb = (window.Refad && window.Refad.sb) || window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  let session = null;
  let branches = [];
  let branchUserCounts = {};
  let branchWarehouseCounts = {};
  let branchInvoiceCounts = {};
  let canManage = false;
  let toggleTargetId = null;
  let currentDetailsBranchId = null;

  const esc = (window.Refad && Refad.esc) || function(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
  const money = (window.Refad && Refad.money) || function(v){return Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م'};
  const fmtDate = (window.Refad && Refad.fmtDate) || function(d){if(!d)return'—';return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'})};
  const fmtDateTime = (window.Refad && Refad.fmtDateTime) || function(d){if(!d)return'—';return new Date(d).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})};
  const toast = (function(){
    const base = window.Refad && Refad.toast;
    if (base && typeof base === 'object') return function(t,m){(base[t]||base.info||function(){}) (m);};
    if (typeof base === 'function') return base;
    return function(type, msg) {
      const icons = {error:'alert-circle',success:'check-circle',info:'info',warning:'alert-triangle'};
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.innerHTML = '<i data-lucide="' + (icons[type]||'info') + '"></i><span>' + esc(msg) + '</span>';
      const c = document.getElementById('toastContainer');
      if (c) { c.appendChild(el); if (window.lucide) lucide.createIcons();
        setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300)},3000); }
    };
  })();

  function isValidPhone(p) { return !p || /^[\+]?[0-9\s\-\(\)]{7,20}$/.test(p); }

  // ═══════════════════════════════════════════════════════════
  // LOADERS
  // ═══════════════════════════════════════════════════════════
  async function loadBranches() {
    const res = await sb.from('branches')
      .select('*')
      .eq('company_id', session.company_id)
      .is('deleted_at', null)
      .order('created_at');
    if (res.error) { toast('error', 'فشل تحميل الفروع'); return; }
    branches = res.data || [];
  }

  async function loadBranchCounts() {
    const usersRes = await sb.from('users')
      .select('branch_id')
      .eq('company_id', session.company_id)
      .is('deleted_at', null);
    branchUserCounts = {};
    (usersRes.data || []).forEach(u => {
      if (!u.branch_id) return;
      branchUserCounts[u.branch_id] = (branchUserCounts[u.branch_id] || 0) + 1;
    });

    const whRes = await sb.from('warehouses')
      .select('branch_id')
      .eq('company_id', session.company_id);
    branchWarehouseCounts = {};
    (whRes.data || []).forEach(w => {
      if (!w.branch_id) return;
      branchWarehouseCounts[w.branch_id] = (branchWarehouseCounts[w.branch_id] || 0) + 1;
    });

    const thirtyDaysAgo = new Date();
    thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
    const invRes = await sb.from('sales_invoices')
      .select('branch_id')
      .eq('company_id', session.company_id)
      .gte('invoice_date', thirtyDaysAgo.toISOString());
    branchInvoiceCounts = {};
    (invRes.data || []).forEach(inv => {
      if (!inv.branch_id) return;
      branchInvoiceCounts[inv.branch_id] = (branchInvoiceCounts[inv.branch_id] || 0) + 1;
    });
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════
  function renderStats() {
    const active = branches.filter(b => b.is_active).length;
    const inactive = branches.length - active;
    const totalUsers = Object.values(branchUserCounts).reduce((s, n) => s + n, 0);

    document.getElementById('statTotal').textContent = branches.length;
    document.getElementById('statTotalSub').textContent = branches.filter(b => (b.code || '').toUpperCase() === 'MAIN').length + ' رئيسي';
    document.getElementById('statActive').textContent = active;
    document.getElementById('statActiveSub').textContent = ((active / Math.max(branches.length, 1)) * 100).toFixed(0) + '%';
    document.getElementById('statInactive').textContent = inactive;
    document.getElementById('statUsers').textContent = totalUsers;
    document.getElementById('statUsersSub').textContent = 'في ' + branches.length + ' فرع';
  }

  function renderBranches() {
    const grid = document.getElementById('branchesGrid');
    if (branches.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><i data-lucide="git-branch"></i><h3>لا توجد فروع</h3><p>اضغط "فرع جديد" للبدء</p></div>';
      if (window.lucide) lucide.createIcons();
      return;
    }

    grid.innerHTML = branches.map(b => {
      const usersCount = branchUserCounts[b.id] || 0;
      const warehousesCount = branchWarehouseCounts[b.id] || 0;
      const invoicesCount = branchInvoiceCounts[b.id] || 0;
      const isMain = (b.code || '').toUpperCase() === 'MAIN';
      const isActive = b.is_active;
      const canEdit = canManage;
      const canDelete = canManage && !isMain;

      let badges = '';
      if (isMain) badges += '<span class="badge badge-warning"><i data-lucide="crown"></i>رئيسي</span>';
      if (isActive) badges += '<span class="badge badge-success"><i data-lucide="check"></i>نشط</span>';
      else badges += '<span class="badge badge-danger"><i data-lucide="x-circle"></i>معطل</span>';

      return '<div class="branch-card' + (isActive ? '' : ' inactive') + (isMain ? ' main-branch' : '') + '" data-branch-id="' + b.id + '">' +
        '<div class="branch-card-header">' +
          '<div class="branch-icon' + (isActive ? '' : ' inactive') + (isMain ? ' main-branch' : '') + '">' + esc((b.name || '?').charAt(0)) + '</div>' +
          '<div class="branch-info">' +
            '<div class="branch-name">' + esc(b.name) + '</div>' +
            '<div class="branch-code">' + esc(b.code || '—') + '</div>' +
          '</div>' +
        '</div>' +

        '<div class="branch-badges">' + badges + '</div>' +

        '<div class="branch-details">' +
          (b.phone ? '<div class="branch-detail"><i data-lucide="phone"></i><span dir="ltr">' + esc(b.phone) + '</span></div>' : '') +
          (b.address ? '<div class="branch-detail"><i data-lucide="map-pin"></i><span>' + esc(b.address) + '</span></div>' : '') +
        '</div>' +

        '<div class="branch-stats">' +
          '<div class="branch-stat"><div class="branch-stat-value">' + usersCount + '</div><div class="branch-stat-label">مستخدمون</div></div>' +
          '<div class="branch-stat"><div class="branch-stat-value">' + warehousesCount + '</div><div class="branch-stat-label">مخازن</div></div>' +
          '<div class="branch-stat"><div class="branch-stat-value small">' + invoicesCount + '</div><div class="branch-stat-label">فواتير (30ي)</div></div>' +
        '</div>' +

        '<div class="branch-actions">' +
          '<button class="btn btn-ghost" data-action="view" data-id="' + b.id + '"><i data-lucide="eye"></i>تفاصيل</button>' +
          (canEdit ? '<button class="btn btn-ghost" data-action="edit" data-id="' + b.id + '"><i data-lucide="edit"></i>تعديل</button>' : '') +
          (canEdit && !isMain ? '<button class="btn btn-ghost icon-only" data-action="toggle" data-id="' + b.id + '" title="' + (isActive ? 'تعطيل' : 'تفعيل') + '"><i data-lucide="power"></i></button>' : '') +
          (canDelete ? '<button class="btn btn-danger icon-only" data-action="delete" data-id="' + b.id + '" title="حذف"><i data-lucide="trash-2"></i></button>' : '') +
        '</div>' +
      '</div>';
    }).join('');

    if (window.lucide) lucide.createIcons();

    // Bind actions
    grid.querySelectorAll('[data-action]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const action = btn.dataset.action;
        const id = btn.dataset.id;
        if (action === 'view') showBranchDetails(id);
        else if (action === 'edit') openEditModal(id);
        else if (action === 'toggle') openToggleModal(id);
        else if (action === 'delete') deleteBranch(id);
      };
    });

    // ⭐ Click on card → show details
    grid.querySelectorAll('.branch-card').forEach(card => {
      card.onclick = (e) => {
        if (e.target.closest('[data-action]')) return;
        showBranchDetails(card.dataset.branchId);
      };
    });
  }

  // ═══════════════════════════════════════════════════════════
  // ⭐ NEW: BRANCH DETAILS
  // ═══════════════════════════════════════════════════════════
  async function showBranchDetails(id) {
    const b = branches.find(x => x.id === id);
    if (!b) return;

    currentDetailsBranchId = id;
    const isMain = (b.code || '').toUpperCase() === 'MAIN';

    document.getElementById('detailsTitle').textContent = b.name;
    document.getElementById('detailsBody').innerHTML = '<div class="details-loading"><div class="spinner"></div>جاري تحميل البيانات...</div>';
    document.getElementById('detailsModal').classList.add('show');

    // ⭐ Load all related data in parallel
    const [
      usersRes,
      warehousesRes,
      invoicesRes,
      productsCountRes,
      customersRes,
      suppliersRes,
      sessionsRes,
      recentInvoicesRes,
      movementsRes
    ] = await Promise.all([
      // Users
      sb.from('users')
        .select('id, full_name, email, username, phone, is_owner, is_active, last_login, created_at, role_id')
        .eq('company_id', session.company_id)
        .eq('branch_id', id)
        .is('deleted_at', null)
        .order('is_owner', { ascending: false })
        .order('created_at'),
      // Warehouses
      sb.from('warehouses')
        .select('id, name, code, is_active, created_at')
        .eq('company_id', session.company_id)
        .eq('branch_id', id),
      // Invoices (last 30 days)
      sb.from('sales_invoices')
        .select('id, invoice_number, invoice_date, total, paid, status, customer_id')
        .eq('company_id', session.company_id)
        .eq('branch_id', id)
        .gte('invoice_date', new Date(Date.now() - 30 * 24 * 60 * 60 * 1000).toISOString())
        .order('invoice_date', { ascending: false }),
      // Products count (company-wide, not per-branch in this schema)
      sb.from('products')
        .select('id', { count: 'exact', head: true })
        .eq('company_id', session.company_id)
        .eq('is_active', true)
        .is('deleted_at', null),
      // Customers count (company-wide)
      sb.from('customers')
        .select('id', { count: 'exact', head: true })
        .eq('company_id', session.company_id)
        .eq('is_active', true)
        .is('deleted_at', null),
      // Suppliers count (company-wide)
      sb.from('suppliers')
        .select('id', { count: 'exact', head: true })
        .eq('company_id', session.company_id)
        .eq('is_active', true)
        .is('deleted_at', null),
      // POS sessions
      sb.from('pos_sessions')
        .select('id, status, opened_at, closed_at, opening_cash, total_sales, total_returns')
        .eq('company_id', session.company_id)
        .eq('branch_id', id)
        .order('opened_at', { ascending: false })
        .limit(10),
      // Recent invoices (last 10)
      sb.from('sales_invoices')
        .select('id, invoice_number, invoice_date, total, paid, status')
        .eq('company_id', session.company_id)
        .eq('branch_id', id)
        .order('invoice_date', { ascending: false })
        .limit(10),
      // Inventory movements (last 10)
      sb.from('inventory_movements')
        .select('id, movement_type, quantity, created_at, product_id, reason')
        .eq('company_id', session.company_id)
        .eq('branch_id', id)
        .order('created_at', { ascending: false })
        .limit(10)
    ]);

    const users = usersRes.data || [];
    const warehouses = warehousesRes.data || [];
    const invoices = invoicesRes.data || [];
    const productsCount = productsCountRes.count || 0;
    const customersCount = customersRes.count || 0;
    const suppliersCount = suppliersRes.count || 0;
    const sessions = sessionsRes.data || [];
    const recentInvoices = recentInvoicesRes.data || [];
    const movements = movementsRes.data || [];

    // ⭐ Load product names for movements
    const movementProductIds = [...new Set(movements.map(m => m.product_id).filter(Boolean))];
    let movementProductMap = {};
    if (movementProductIds.length > 0) {
      const prodRes = await sb.from('products').select('id, name').in('id', movementProductIds);
      (prodRes.data || []).forEach(p => { movementProductMap[p.id] = p; });
    }

    // ⭐ Load role names for users
    const roleIds = [...new Set(users.map(u => u.role_id).filter(Boolean))];
    let roleMap = {};
    if (roleIds.length > 0) {
      const roleRes = await sb.from('roles').select('id, name').in('id', roleIds);
      (roleRes.data || []).forEach(r => { roleMap[r.id] = r; });
    }

    // ⭐ Calculate stats
    const activeInvoices = invoices.filter(i => i.status !== 'voided');
    const totalSales = activeInvoices.reduce((s, i) => s + Number(i.total || 0), 0);
    const totalPaid = activeInvoices.reduce((s, i) => s + Number(i.paid || 0), 0);
    const creditSales = activeInvoices.filter(i => i.status === 'credit' || i.status === 'partial');
    const totalCredit = creditSales.reduce((s, i) => s + Number(i.remaining || i.total || 0), 0);
    const avgTicket = activeInvoices.length > 0 ? totalSales / activeInvoices.length : 0;
    const activeSessions = sessions.filter(s => s.status === 'open');

    let html = '';

    // Tabs
    html += '<div class="details-tabs">' +
      '<button class="details-tab active" data-dtab="overview"><i data-lucide="layout-dashboard"></i>نظرة عامة</button>' +
      '<button class="details-tab" data-dtab="users"><i data-lucide="users"></i>المستخدمون <span class="count-badge">' + users.length + '</span></button>' +
      '<button class="details-tab" data-dtab="warehouses"><i data-lucide="warehouse"></i>المخازن <span class="count-badge">' + warehouses.length + '</span></button>' +
      '<button class="details-tab" data-dtab="invoices"><i data-lucide="receipt"></i>الفواتير <span class="count-badge">' + invoices.length + '</span></button>' +
      '<button class="details-tab" data-dtab="sessions"><i data-lucide="clock"></i>الورديات <span class="count-badge">' + sessions.length + '</span></button>' +
      '<button class="details-tab" data-dtab="movements"><i data-lucide="arrow-left-right"></i>الحركات <span class="count-badge">' + movements.length + '</span></button>' +
    '</div>';

    // ═══════════════════════════════════════════════════════════
    // TAB: OVERVIEW
    // ═══════════════════════════════════════════════════════════
    html += '<div class="details-panel active" data-dpanel="overview">';

    // Branch info
    html += '<div class="info-grid">' +
      '<div class="info-item"><div class="info-label">اسم الفرع</div><div class="info-value">' + esc(b.name) + '</div></div>' +
      '<div class="info-item"><div class="info-label">الكود</div><div class="info-value"><span style="font-family:monospace">' + esc(b.code || '—') + '</span>' + (isMain ? ' <span class="badge badge-warning" style="font-size:10px"><i data-lucide="crown"></i>MAIN</span>' : '') + '</div></div>' +
      '<div class="info-item"><div class="info-label">الهاتف</div><div class="info-value' + (b.phone ? '' : ' empty') + '">' + (b.phone ? '<span dir="ltr">' + esc(b.phone) + '</span>' : 'غير مسجل') + '</div></div>' +
      '<div class="info-item"><div class="info-label">العنوان</div><div class="info-value' + (b.address ? '' : ' empty') + '">' + (b.address ? esc(b.address) : 'غير مسجل') + '</div></div>' +
      '<div class="info-item"><div class="info-label">الحالة</div><div class="info-value">' + (b.is_active ? '<span class="badge badge-success"><i data-lucide="check"></i>نشط</span>' : '<span class="badge badge-danger"><i data-lucide="x"></i>معطل</span>') + '</div></div>' +
      '<div class="info-item"><div class="info-label">تاريخ الإنشاء</div><div class="info-value">' + fmtDate(b.created_at) + '</div></div>' +
    '</div>';

    // Mini stats
    html += '<div class="mini-stat-grid">' +
      '<div class="mini-stat"><div class="mini-stat-icon teal"><i data-lucide="banknote"></i></div><div class="mini-stat-value" style="color:var(--accent)">' + money(totalSales) + '</div><div class="mini-stat-label">مبيعات 30 يوم</div></div>' +
      '<div class="mini-stat"><div class="mini-stat-icon blue"><i data-lucide="receipt"></i></div><div class="mini-stat-value" style="color:var(--info)">' + activeInvoices.length + '</div><div class="mini-stat-label">عدد الفواتير</div></div>' +
      '<div class="mini-stat"><div class="mini-stat-icon green"><i data-lucide="wallet"></i></div><div class="mini-stat-value" style="color:var(--success)">' + money(totalPaid) + '</div><div class="mini-stat-label">المدفوع</div></div>' +
      '<div class="mini-stat"><div class="mini-stat-icon red"><i data-lucide="alert-circle"></i></div><div class="mini-stat-value" style="color:var(--danger)">' + money(totalCredit) + '</div><div class="mini-stat-label">آجل</div></div>' +
      '<div class="mini-stat"><div class="mini-stat-icon purple"><i data-lucide="trending-up"></i></div><div class="mini-stat-value" style="color:var(--purple)">' + money(avgTicket) + '</div><div class="mini-stat-label">متوسط الفاتورة</div></div>' +
      '<div class="mini-stat"><div class="mini-stat-icon gold"><i data-lucide="users"></i></div><div class="mini-stat-value" style="color:var(--gold)">' + users.length + '</div><div class="mini-stat-label">مستخدمون</div></div>' +
    '</div>';

    // Related data
    html += '<div class="details-section">' +
      '<div class="details-section-title"><i data-lucide="database"></i>بيانات مرتبطة<span class="count-badge">' + (productsCount + customersCount + suppliersCount) + '</span></div>' +
      '<div class="info-grid">' +
        '<div class="info-item"><div class="info-label">المنتجات (الشركة)</div><div class="info-value">' + productsCount + '</div></div>' +
        '<div class="info-item"><div class="info-label">العملاء (الشركة)</div><div class="info-value">' + customersCount + '</div></div>' +
        '<div class="info-item"><div class="info-label">الموردون (الشركة)</div><div class="info-value">' + suppliersCount + '</div></div>' +
        '<div class="info-item"><div class="info-label">الورديات المفتوحة</div><div class="info-value">' + (activeSessions.length > 0 ? '<span style="color:var(--success)">' + activeSessions.length + ' مفتوحة</span>' : 'لا يوجد') + '</div></div>' +
      '</div>' +
    '</div>';

    html += '</div>';

    // ═══════════════════════════════════════════════════════════
    // TAB: USERS
    // ═══════════════════════════════════════════════════════════
    html += '<div class="details-panel" data-dpanel="users">';
    if (users.length === 0) {
      html += '<div class="empty-details"><i data-lucide="users"></i><h3>لا يوجد مستخدمون</h3><p>لم يتم تعيين مستخدمين لهذا الفرع بعد</p></div>';
    } else {
      html += '<div class="detail-list">';
      users.forEach(u => {
        const isOwner = u.is_owner;
        const roleName = (roleMap[u.role_id] && roleMap[u.role_id].name) || (isOwner ? 'مالك' : 'مستخدم');
        html += '<div class="detail-list-item">' +
          '<div class="detail-list-left">' +
            '<div class="detail-list-icon" style="background:' + (isOwner ? 'var(--gold-soft);color:var(--gold)' : 'var(--accent-soft);color:var(--accent)') + '">' +
              '<i data-lucide="' + (isOwner ? 'crown' : 'user') + '"></i>' +
            '</div>' +
            '<div class="detail-list-info">' +
              '<div class="detail-list-name">' + esc(u.full_name || u.email) + (isOwner ? ' <span class="badge badge-warning" style="font-size:9px;padding:1px 6px">مالك</span>' : '') + '</div>' +
              '<div class="detail-list-meta">' + esc(u.email || u.username || '—') + ' · ' + esc(roleName) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="detail-list-right">' +
            (u.is_active ? '<span class="badge badge-success">نشط</span>' : '<span class="badge badge-danger">معطل</span>') +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    // ═══════════════════════════════════════════════════════════
    // TAB: WAREHOUSES
    // ═══════════════════════════════════════════════════════════
    html += '<div class="details-panel" data-dpanel="warehouses">';
    if (warehouses.length === 0) {
      html += '<div class="empty-details"><i data-lucide="warehouse"></i><h3>لا يوجد مخازن</h3><p>لم يتم إنشاء مخازن لهذا الفرع بعد</p></div>';
    } else {
      html += '<div class="detail-list">';
      warehouses.forEach(w => {
        html += '<div class="detail-list-item">' +
          '<div class="detail-list-left">' +
            '<div class="detail-list-icon"><i data-lucide="warehouse"></i></div>' +
            '<div class="detail-list-info">' +
              '<div class="detail-list-name">' + esc(w.name) + '</div>' +
              '<div class="detail-list-meta">' + esc(w.code || '—') + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="detail-list-right">' +
            (w.is_active ? '<span class="badge badge-success">نشط</span>' : '<span class="badge badge-danger">معطل</span>') +
          '</div>' +
        '</div>';
      });
      html += '</div>';
    }
    html += '</div>';

    // ═══════════════════════════════════════════════════════════
    // TAB: INVOICES
    // ═══════════════════════════════════════════════════════════
    html += '<div class="details-panel" data-dpanel="invoices">';
    if (recentInvoices.length === 0) {
      html += '<div class="empty-details"><i data-lucide="receipt"></i><h3>لا توجد فواتير</h3><p>لم يتم إصدار فواتير من هذا الفرع بعد</p></div>';
    } else {
      html += '<div style="overflow-x:auto"><table class="detail-table"><thead><tr>' +
        '<th>رقم الفاتورة</th><th>التاريخ</th><th>الإجمالي</th><th>المدفوع</th><th>الحالة</th>' +
        '</tr></thead><tbody>';
      recentInvoices.forEach(inv => {
        const statusMap = { paid:['success','مدفوعة'], partial:['warning','جزئية'], credit:['info','آجلة'], voided:['danger','ملغاة'], returned:['danger','مرتجعة'] };
        const [cls, txt] = statusMap[inv.status] || ['gray', inv.status];
        html += '<tr>' +
          '<td><strong style="font-family:monospace">' + esc(inv.invoice_number) + '</strong></td>' +
          '<td>' + fmtDateTime(inv.invoice_date) + '</td>' +
          '<td><strong>' + money(inv.total) + '</strong></td>' +
          '<td>' + money(inv.paid) + '</td>' +
          '<td><span class="badge badge-' + cls + '">' + txt + '</span></td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
      if (invoices.length > recentInvoices.length) {
        html += '<p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:12px">يتم عرض آخر 10 فواتير من أصل ' + invoices.length + '</p>';
      }
    }
    html += '</div>';

    // ═══════════════════════════════════════════════════════════
    // TAB: SESSIONS
    // ═══════════════════════════════════════════════════════════
    html += '<div class="details-panel" data-dpanel="sessions">';
    if (sessions.length === 0) {
      html += '<div class="empty-details"><i data-lucide="clock"></i><h3>لا توجد ورديات</h3><p>لم يتم فتح ورديات في هذا الفرع بعد</p></div>';
    } else {
      html += '<div style="overflow-x:auto"><table class="detail-table"><thead><tr>' +
        '<th>الحالة</th><th>الافتتاح</th><th>الإغلاق</th><th>رصيد افتتاحي</th><th>المبيعات</th><th>المرتجعات</th>' +
        '</tr></thead><tbody>';
      sessions.forEach(s => {
        html += '<tr>' +
          '<td>' + (s.status === 'open' ? '<span class="badge badge-success">مفتوحة</span>' : '<span class="badge badge-gray">مغلقة</span>') + '</td>' +
          '<td>' + fmtDateTime(s.opened_at) + '</td>' +
          '<td>' + (s.closed_at ? fmtDateTime(s.closed_at) : '—') + '</td>' +
          '<td>' + money(s.opening_cash) + '</td>' +
          '<td><strong style="color:var(--success)">' + money(s.total_sales) + '</strong></td>' +
          '<td><strong style="color:var(--danger)">' + money(s.total_returns) + '</strong></td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    // ═══════════════════════════════════════════════════════════
    // TAB: MOVEMENTS
    // ═══════════════════════════════════════════════════════════
    html += '<div class="details-panel" data-dpanel="movements">';
    if (movements.length === 0) {
      html += '<div class="empty-details"><i data-lucide="arrow-left-right"></i><h3>لا توجد حركات مخزون</h3><p>لم يتم تسجيل حركات مخزون في هذا الفرع بعد</p></div>';
    } else {
      const movTypeMap = { in:['success','دخول'], out:['warning','خروج'], adjust:['info','تسوية'], shrink:['danger','هالك'], return:['purple','مرتجع'], transfer:['info','تحويل'] };
      html += '<div style="overflow-x:auto"><table class="detail-table"><thead><tr>' +
        '<th>التاريخ</th><th>المنتج</th><th>النوع</th><th>الكمية</th><th>السبب</th>' +
        '</tr></thead><tbody>';
      movements.forEach(m => {
        const [cls, txt] = movTypeMap[m.movement_type] || ['gray', m.movement_type];
        const product = movementProductMap[m.product_id];
        html += '<tr>' +
          '<td>' + fmtDateTime(m.created_at) + '</td>' +
          '<td>' + esc((product && product.name) || '—') + '</td>' +
          '<td><span class="badge badge-' + cls + '">' + txt + '</span></td>' +
          '<td><strong>' + Number(m.quantity || 0) + '</strong></td>' +
          '<td style="font-size:11px;color:var(--text-muted)">' + esc(m.reason || '—') + '</td>' +
        '</tr>';
      });
      html += '</tbody></table></div>';
    }
    html += '</div>';

    document.getElementById('detailsBody').innerHTML = html;

    // ⭐ Bind tabs
    document.querySelectorAll('[data-dtab]').forEach(tab => {
      tab.onclick = () => {
        const key = tab.dataset.dtab;
        document.querySelectorAll('[data-dtab]').forEach(t => t.classList.toggle('active', t.dataset.dtab === key));
        document.querySelectorAll('[data-dpanel]').forEach(p => p.classList.toggle('active', p.dataset.dpanel === key));
      };
    });

    if (window.lucide) lucide.createIcons();
  }

  // ═══════════════════════════════════════════════════════════
  // ADD/EDIT
  // ═══════════════════════════════════════════════════════════
  function openAddModal() {
    document.getElementById('modalTitle').textContent = 'فرع جديد';
    document.getElementById('branchFormError').classList.remove('show');
    document.getElementById('branchId').value = '';
    document.getElementById('brName').value = '';
    document.getElementById('brCode').value = '';
    document.getElementById('brPhone').value = '';
    document.getElementById('brAddress').value = '';
    document.getElementById('brActive').checked = true;
    document.getElementById('brIsMain').checked = false;
    document.getElementById('brIsMain').disabled = false;
    document.getElementById('isMainCheck').style.display = 'flex';

    document.querySelectorAll('#branchModal .form-input.error, #branchModal .form-textarea.error').forEach(i => i.classList.remove('error'));
    document.getElementById('branchModal').classList.add('show');
    if (window.lucide) lucide.createIcons();
  }

  function openEditModal(id) {
    const b = branches.find(x => x.id === id);
    if (!b) return;
    const isMain = (b.code || '').toUpperCase() === 'MAIN';

    document.getElementById('modalTitle').textContent = 'تعديل الفرع';
    document.getElementById('branchFormError').classList.remove('show');
    document.getElementById('branchId').value = b.id;
    document.getElementById('brName').value = b.name || '';
    document.getElementById('brCode').value = b.code || '';
    document.getElementById('brPhone').value = b.phone || '';
    document.getElementById('brAddress').value = b.address || '';
    document.getElementById('brActive').checked = b.is_active;

    if (isMain) {
      document.getElementById('isMainCheck').style.display = 'none';
    } else {
      document.getElementById('isMainCheck').style.display = 'flex';
      document.getElementById('brIsMain').checked = false;
      document.getElementById('brIsMain').disabled = false;
    }

    document.querySelectorAll('#branchModal .form-input.error, #branchModal .form-textarea.error').forEach(i => i.classList.remove('error'));
    document.getElementById('branchModal').classList.add('show');
    if (window.lucide) lucide.createIcons();
  }

  async function saveBranch() {
    const errEl = document.getElementById('branchFormError');
    errEl.classList.remove('show');

    const id = document.getElementById('branchId').value;
    const name = document.getElementById('brName').value.trim();
    const code = document.getElementById('brCode').value.trim().toUpperCase();
    const phone = document.getElementById('brPhone').value.trim();
    const address = document.getElementById('brAddress').value.trim();
    const isActive = document.getElementById('brActive').checked;
    const isMain = document.getElementById('isMainCheck').style.display !== 'none' && document.getElementById('brIsMain').checked;

    document.querySelectorAll('#branchModal .form-input.error, #branchModal .form-textarea.error').forEach(i => i.classList.remove('error'));

    if (!name) {
      document.getElementById('brName').classList.add('error');
      errEl.textContent = 'اسم الفرع مطلوب';
      errEl.classList.add('show');
      return;
    }
    if (phone && !isValidPhone(phone)) {
      document.getElementById('brPhone').classList.add('error');
      errEl.textContent = 'صيغة الهاتف غير صحيحة';
      errEl.classList.add('show');
      return;
    }

    if (code) {
      const dup = branches.find(b => b.id !== id && (b.code || '').toUpperCase() === code);
      if (dup) {
        document.getElementById('brCode').classList.add('error');
        errEl.textContent = 'الكود مستخدم بالفعل في فرع: ' + dup.name;
        errEl.classList.add('show');
        return;
      }
    }

    if (isMain && !id) {
      const existingMain = branches.find(b => (b.code || '').toUpperCase() === 'MAIN');
      if (existingMain && !confirm('يوجد فرع رئيسي بالفعل (' + existingMain.name + '). هل تريد تغييره؟')) {
        return;
      }
    }

    const btn = document.getElementById('saveBranchBtn');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div><span>جاري الحفظ...</span>';

    try {
      if (isMain) {
        const existingMain = branches.find(b => b.id !== id && (b.code || '').toUpperCase() === 'MAIN');
        if (existingMain) {
          await sb.from('branches').update({ code: 'BR-' + Date.now() }).eq('id', existingMain.id);
        }
      }

      const payload = {
        company_id: session.company_id,
        name: name,
        code: isMain ? 'MAIN' : (code || null),
        phone: phone || null,
        address: address || null,
        is_active: isActive,
        updated_at: new Date().toISOString()
      };

      if (id) {
        const res = await sb.from('branches').update(payload).eq('id', id);
        if (res.error) throw res.error;
        toast('success', 'تم تحديث الفرع');
      } else {
        const res = await sb.from('branches').insert(payload);
        if (res.error) throw res.error;
        toast('success', 'تم إنشاء الفرع');
      }

      document.getElementById('branchModal').classList.remove('show');
      await reload();
    } catch (e) {
      let msg = e.message || 'فشل';
      if (msg.includes('duplicate') || msg.includes('unique')) msg = 'يوجد تكرار';
      errEl.textContent = msg;
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.innerHTML = original;
      if (window.lucide) lucide.createIcons();
    }
  }

  // ═══════════════════════════════════════════════════════════
  // TOGGLE
  // ═══════════════════════════════════════════════════════════
  function openToggleModal(id) {
    const b = branches.find(x => x.id === id);
    if (!b) return;
    toggleTargetId = id;

    const usersCount = branchUserCounts[id] || 0;
    const isActive = b.is_active;
    const newState = !isActive;

    document.getElementById('toggleMessage').innerHTML =
      'هل تريد ' + (newState ? 'تفعيل' : 'تعطيل') + ' الفرع <strong>' + esc(b.name) + '</strong>؟';

    const warnBox = document.getElementById('toggleWarning');
    const warnText = document.getElementById('toggleWarningText');

    if (!newState && usersCount > 0) {
      warnBox.style.display = 'flex';
      warnText.innerHTML = '<strong>تحذير:</strong> يوجد <strong>' + usersCount + ' مستخدم</strong> مرتبط بهذا الفرع. تعطيل الفرع سيمنعهم من تسجيل الدخول في المرة القادمة.';
    } else {
      warnBox.style.display = 'none';
    }

    document.getElementById('toggleModal').classList.add('show');
    if (window.lucide) lucide.createIcons();
  }

  async function confirmToggle() {
    if (!toggleTargetId) return;
    const b = branches.find(x => x.id === toggleTargetId);
    if (!b) return;

    const newState = !b.is_active;
    const btn = document.getElementById('confirmToggleBtn');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<div class="spinner" style="width:16px;height:16px;border-width:2px;margin:0"></div><span>جاري...</span>';

    try {
      const res = await sb.from('branches').update({ is_active: newState }).eq('id', toggleTargetId);
      if (res.error) throw res.error;
      toast('success', newState ? 'تم تفعيل الفرع' : 'تم تعطيل الفرع');
      document.getElementById('toggleModal').classList.remove('show');
      toggleTargetId = null;
      await reload();
    } catch (e) {
      toast('error', e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = original;
      if (window.lucide) lucide.createIcons();
    }
  }

  // ═══════════════════════════════════════════════════════════
  // DELETE
  // ═══════════════════════════════════════════════════════════
  async function deleteBranch(id) {
    const b = branches.find(x => x.id === id);
    if (!b) return;

    if ((b.code || '').toUpperCase() === 'MAIN') {
      toast('error', 'لا يمكن حذف الفرع الرئيسي');
      return;
    }

    const usersCount = branchUserCounts[id] || 0;
    const warehousesCount = branchWarehouseCounts[id] || 0;

    if (usersCount > 0) {
      toast('error', 'الفرع مرتبط بـ ' + usersCount + ' مستخدم — انقلهم أولاً');
      return;
    }

    if (warehousesCount > 0) {
      toast('error', 'الفرع مرتبط بـ ' + warehousesCount + ' مخزن — احذفهم أولاً');
      return;
    }

    if (!confirm('حذف الفرع "' + b.name + '"؟\nلا يمكن التراجع عن هذا الإجراء.')) return;

    try {
      const res = await sb.from('branches').update({
        deleted_at: new Date().toISOString(),
        is_active: false
      }).eq('id', id);
      if (res.error) throw res.error;
      toast('success', 'تم حذف الفرع');
      await reload();
    } catch (e) {
      toast('error', e.message);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // RELOAD
  // ═══════════════════════════════════════════════════════════
  async function reload() {
    await loadBranches();
    await loadBranchCounts();
    renderStats();
    renderBranches();
  }

  // ═══════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════
  async function init() {
    // ⭐ كشف platform admin
    try {
      const { data: { user } } = await sb.auth.getUser();
      if (user) {
        const { data: pa } = await sb.from('platform_admins')
          .select('id').eq('id', user.id).eq('is_active', true).maybeSingle();
        if (pa) {
          console.log('[Branches] Platform admin — redirecting to admin.html');
          location.href = 'admin.html';
          return;
        }
      }
    } catch (e) { console.warn('[Branches] admin check failed:', e); }

    if (window.Refad && Refad.requireSession) {
      session = await Refad.requireSession();
    }
    if (!session) { location.href = 'index.html'; return; }
    if (!session.company_id) {
      console.warn('[Branches] No company_id');
      location.href = 'index.html';
      return;
    }

    canManage = !!(session.is_owner || (session.permissions && (session.permissions.includes('admin.full') || session.permissions.includes('branches.manage'))));

    const branchNameEl = document.getElementById('branchName');
    if (branchNameEl) {
      const companyName = (window.RefadSettings && window.RefadSettings.get('general.company_name')) || session.company_name;
      branchNameEl.textContent = (companyName || '') + ' — ' + (session.branch_name || '—');
    }

    if (!canManage) {
      document.getElementById('permissionBanner').style.display = 'flex';
      document.getElementById('permissionBannerText').innerHTML = '<strong>وضع القراءة فقط.</strong> إدارة الفروع متاحة للمالك أو من لديه صلاحية <code>branches.manage</code>.';
      document.getElementById('addBranchBtn').style.display = 'none';
    }

    await reload();

    document.getElementById('addBranchBtn').onclick = openAddModal;
    document.getElementById('saveBranchBtn').onclick = saveBranch;
    document.getElementById('confirmToggleBtn').onclick = confirmToggle;
    document.getElementById('refreshBtn').onclick = async () => {
      toast('info', 'جاري التحديث...');
      await reload();
      toast('success', 'تم التحديث');
    };

    document.querySelectorAll('[data-close]').forEach(el => {
      el.onclick = () => document.getElementById(el.dataset.close).classList.remove('show');
    });
    document.querySelectorAll('.modal-overlay').forEach(m => {
      m.onclick = (e) => { if (e.target === m) m.classList.remove('show'); };
    });

    window.addEventListener('refad:settings-changed', () => {
      const companyName = (window.RefadSettings && window.RefadSettings.get('general.company_name')) || session.company_name;
      if (branchNameEl) branchNameEl.textContent = (companyName || '') + ' — ' + (session.branch_name || '—');
    });

    if (window.lucide) lucide.createIcons();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();
</script>
