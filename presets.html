<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B2C4D">
<title>القوالب الجاهزة — رفاد</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script src="config.js"></script>
<script src="theme-manager.js"></script>
<script src="settings-manager.js"></script>
<script src="app.js"></script>
<script src="theme.js"></script>

<style>
:root {
  --primary:#0B2C4D; --primary-light:#1e4a73; --primary-dark:#061a2e;
  --accent:#14B8A6; --accent-dark:#0d9488; --accent-soft:rgba(20,184,166,0.1);
  --gold:#F59E0B; --gold-soft:rgba(245,158,11,0.1);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,0.1);
  --success:#10b981; --success-soft:rgba(16,185,129,0.1);
  --info:#3b82f6; --info-soft:rgba(59,130,246,0.1);
  --purple:#8b5cf6; --purple-soft:rgba(139,92,246,0.1);
  --bg:#F1F5F9; --bg-soft:#f8fafc; --bg-card:#ffffff;
  --card:#ffffff; --text:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0; --border-soft:#f1f5f9;
  --radius:14px; --radius-sm:10px; --radius-xs:8px;
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 20px rgba(11,44,77,0.08);
  --shadow-lg:0 10px 40px rgba(11,44,77,0.12);
  --font-family:'Segoe UI','Cairo',Tahoma,sans-serif;
}
[data-theme="dark"]{--bg:#0f172a;--bg-soft:#1e293b;--bg-card:#1e293b;--card:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--border:#334155;--border-soft:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-family);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.main{min-height:100vh}
.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-xs);gap:12px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar h1{font-size:19px;font-weight:800;white-space:nowrap}
.topbar-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.btn{padding:10px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;border:none;display:inline-flex;align-items:center;gap:8px;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-soft)}
.btn-ghost{background:var(--bg-soft);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg);border-color:var(--accent)}
.btn-icon{padding:9px;width:38px;height:38px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.content{padding:24px;max-width:1200px;margin:0 auto}

.hero{background:linear-gradient(135deg,var(--accent-soft),var(--purple-soft));border:1px solid var(--accent-soft);border-radius:var(--radius);padding:32px 24px;margin-bottom:24px;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-100px;left:-100px;width:300px;height:300px;background:radial-gradient(circle,var(--accent-soft),transparent 70%);pointer-events:none}
.hero-icon{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 8px 24px var(--accent-soft);position:relative}
.hero-icon svg{width:32px;height:32px}
.hero h2{font-size:24px;font-weight:900;margin-bottom:8px;position:relative}
.hero p{font-size:14px;color:var(--text-muted);max-width:600px;margin:0 auto;line-height:1.7;position:relative}

/* Current preset */
.current-preset{background:var(--success-soft);border:2px solid var(--success);border-radius:var(--radius);padding:20px;margin-bottom:24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.current-preset-icon{width:56px;height:56px;border-radius:14px;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 4px 12px var(--success-soft)}
.current-preset-icon svg{width:28px;height:28px}
.current-preset-info{flex:1;min-width:200px}
.current-preset-label{font-size:11px;color:var(--success);font-weight:800;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:4px}
.current-preset-name{font-size:18px;font-weight:800;margin-bottom:2px}
.current-preset-desc{font-size:12.5px;color:var(--text-muted)}
.current-preset-check{width:44px;height:44px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.current-preset-check svg{width:22px;height:22px}

/* Presets Grid */
.presets-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;margin-bottom:24px}
.preset-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:24px;position:relative;overflow:hidden;transition:all .25s;display:flex;flex-direction:column;gap:16px;cursor:pointer}
.preset-card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:var(--shadow-lg)}
.preset-card.active{border-color:var(--success);background:linear-gradient(135deg,var(--card),var(--success-soft))}
.preset-card.active::after{content:'✓';position:absolute;top:16px;left:16px;width:28px;height:28px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;box-shadow:0 2px 8px var(--success-soft)}

.preset-icon{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,0.1);flex-shrink:0}
.preset-icon svg{width:32px;height:32px}
.preset-icon.small_supermarket{background:linear-gradient(135deg,var(--info),#1d4ed8);color:#fff}
.preset-icon.chain{background:linear-gradient(135deg,var(--accent),var(--accent-dark));color:#fff}
.preset-icon.hypermarket{background:linear-gradient(135deg,var(--purple),#7c3aed);color:#fff}

.preset-title{font-size:20px;font-weight:900;margin-bottom:4px}
.preset-subtitle{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:4px}

.preset-features{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.preset-feature{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text)}
.preset-feature-icon{width:20px;height:20px;border-radius:50%;background:var(--success-soft);color:var(--success);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.preset-feature-icon svg{width:12px;height:12px}
.preset-feature.disabled .preset-feature-icon{background:var(--bg-soft);color:var(--text-muted)}
.preset-feature.disabled{color:var(--text-muted);text-decoration:line-through;opacity:0.7}

.preset-apply-btn{width:100%;padding:14px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-size:14px;font-weight:800;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px}
.preset-apply-btn:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 6px 16px var(--accent-soft)}
.preset-apply-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.preset-apply-btn.active{background:var(--success);cursor:default}
.preset-apply-btn svg{width:16px;height:16px}

/* Warning box */
.warning-box{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;font-size:12.5px;color:var(--text);line-height:1.7}
.warning-box svg{width:18px;height:18px;color:var(--gold);flex-shrink:0;margin-top:2px}
.warning-box strong{color:var(--gold);display:block;margin-bottom:4px;font-size:13px}

/* Info box */
.info-box{background:var(--info-soft);border:1px solid var(--info);border-radius:var(--radius-sm);padding:14px 18px;margin-bottom:20px;display:flex;align-items:flex-start;gap:12px;font-size:12.5px;color:var(--text);line-height:1.7}
.info-box svg{width:18px;height:18px;color:var(--info);flex-shrink:0;margin-top:2px}
.info-box strong{color:var(--info);display:block;margin-bottom:4px;font-size:13px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;backdrop-filter:blur(6px)}
.modal-overlay.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.4);animation:modalIn .3s cubic-bezier(0.34,1.56,0.64,1)}
@keyframes modalIn{from{opacity:0;transform:scale(0.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.modal-header h3 svg{width:22px;height:22px;color:var(--accent)}
.modal-close{background:var(--bg-soft);border:none;color:var(--text-muted);padding:8px;border-radius:8px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--danger);color:white;transform:rotate(90deg)}
.modal-close svg{width:18px;height:18px}
.modal-body{padding:22px 24px}
.modal-footer{padding:18px 24px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}

.loading-state{padding:60px;text-align:center;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
.spinner.sm{width:16px;height:16px;border-width:2px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}

.toast-container{position:fixed;top:20px;left:20px;z-index:3000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--border);border-right:4px solid var(--accent);padding:14px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);max-width:400px;animation:slideInToast .3s ease-out}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.success{border-right-color:var(--success)}.toast.success svg{color:var(--success)}
.toast.error{border-right-color:var(--danger)}.toast.error svg{color:var(--danger)}
.toast.info{border-right-color:var(--info)}.toast.info svg{color:var(--info)}
.toast.warning{border-right-color:var(--gold)}.toast.warning svg{color:var(--gold)}
@keyframes slideInToast{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

@media (max-width:768px){
  .content{padding:16px}
  .topbar{padding:0 16px}
  .topbar h1{font-size:16px}
  .presets-grid{grid-template-columns:1fr}
  .hero{padding:24px 16px}
  .hero h2{font-size:20px}
}
</style>
</head>
<body>

<div id="refad-sidebar"></div>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <h1>القوالب الجاهزة</h1>
        <div class="topbar-subtitle" id="branchName">—</div>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="تحديث"><i data-lucide="refresh-cw"></i></button>
      <a href="settings.html" class="btn btn-ghost"><i data-lucide="arrow-right"></i>الإعدادات</a>
    </div>
  </div>

  <div class="content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div>جاري التحميل...</div>
  </div>
</main>

<!-- Modal: Confirm Apply -->
<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-header">
      <h3><i data-lucide="alert-triangle"></i><span>تأكيد تطبيق القالب</span></h3>
      <button class="modal-close" id="closeConfirmBtn"><i data-lucide="x"></i></button>
    </div>
    <div class="modal-body">
      <div id="confirmBody"></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" id="cancelConfirmBtn">إلغاء</button>
      <button class="btn btn-primary" id="applyConfirmBtn">
        <i data-lucide="check"></i>
        <span>تطبيق</span>
      </button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
  'use strict';

  const cfg = window.REFAD_CONFIG;
  const sb = (window.Refad && window.Refad.sb) || window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  let session = null;
  let presets = [];
  let currentPresetSlug = null;
  let pendingApplySlug = null;

  const esc = (window.Refad && Refad.esc) || function(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
  const toast = (function(){
    const base = window.Refad && Refad.toast;
    if (base && typeof base === 'object') return function(t,m){(base[t]||base.info||function(){}) (m);};
    if (typeof base === 'function') return base;
    return function(type, msg) {
      const icons = {error:'alert-circle',success:'check-circle',info:'info',warning:'alert-triangle'};
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.innerHTML = '<i data-lucide="' + (icons[type]||'info') + '"></i><span>' + esc(msg) + '</span>';
      const c = document.getElementById('toastContainer');
      if (c) { c.appendChild(el); if (window.lucide) lucide.createIcons();
        setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300)},3000); }
    };
  })();

  const PRESET_INFO = {
    small_supermarket: {
      name: 'سوبرماركت صغير',
      name_en: 'Small Supermarket',
      description: 'مناسب لمحل واحد، كاشير واحد، مخزن واحد. مثالي للبداية.',
      icon: 'store',
      class: 'small_supermarket',
      features: [
        { label: 'كاشير واحد', icon: 'user', enabled: true },
        { label: 'مخزن واحد', icon: 'warehouse', enabled: true },
        { label: 'POS Offline', icon: 'wifi-off', enabled: true },
        { label: 'دفع مختلط', icon: 'split', enabled: false },
        { label: 'تحويلات مخازن', icon: 'truck', enabled: false },
        { label: 'تنبؤات AI', icon: 'trending-up', enabled: false }
      ]
    },
    chain: {
      name: 'سلسلة فروع',
      name_en: 'Chain',
      description: 'مناسب لسلسلة 2-10 فروع، تعدد كاشير، تحويلات بين مخازن.',
      icon: 'git-branch',
      class: 'chain',
      features: [
        { label: 'كاشير متعدد', icon: 'users', enabled: true },
        { label: 'فروع متعددة', icon: 'git-branch', enabled: true },
        { label: 'مخازن متعددة', icon: 'warehouse', enabled: true },
        { label: 'تحويلات مخازن', icon: 'truck', enabled: true },
        { label: 'POS Offline', icon: 'wifi-off', enabled: true },
        { label: 'دفع مختلط', icon: 'split', enabled: true }
      ]
    },
    hypermarket: {
      name: 'هايبر ماركت',
      name_en: 'Hypermarket',
      description: 'مناسب لهايبر ماركت، ميزان، PLU، باركود، تنبؤات متقدمة.',
      icon: 'building',
      class: 'hypermarket',
      features: [
        { label: 'كل مميزات السلسلة', icon: 'check-circle', enabled: true },
        { label: 'ميزان + PLU', icon: 'scale', enabled: true },
        { label: 'مناطق مخازن', icon: 'map', enabled: true },
        { label: 'تنبؤات AI', icon: 'trending-up', enabled: true },
        { label: 'تقارير متقدمة', icon: 'bar-chart-3', enabled: true },
        { label: 'Webhooks', icon: 'webhook', enabled: true }
      ]
    }
  };

  // ═══════════════════════════════════════════════════════════
  // LOAD
  // ═══════════════════════════════════════════════════════════
  async function loadPresets() {
    try {
      const { data, error } = await sb.from('preset_configs')
        .select('*')
        .order('sort_order');
      if (error) throw error;
      presets = data || [];
      console.log('[Presets] Loaded', presets.length, 'presets');
    } catch (e) {
      console.error('[Presets] loadPresets:', e);
      toast('error', 'فشل تحميل القوالب');
      presets = [];
    }
  }

  async function loadCurrentPreset() {
    try {
      // ابحث عن applied preset في feature_flags
      const { data } = await sb.from('feature_flags')
        .select('flag_key, config')
        .eq('company_id', session.company_id)
        .eq('flag_key', 'preset.applied')
        .maybeSingle();

      if (data && data.config && data.config.slug) {
        currentPresetSlug = data.config.slug;
      } else {
        currentPresetSlug = null;
      }
    } catch (e) {
      console.warn('[Presets] loadCurrentPreset:', e);
      currentPresetSlug = null;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════
  async function render() {
    const container = document.getElementById('mainContent');
    await Promise.all([loadPresets(), loadCurrentPreset()]);

    const heroHtml = `
      <div class="hero">
        <div class="hero-icon"><i data-lucide="sparkles"></i></div>
        <h2>اختر القالب المناسب لعملك</h2>
        <p>القوالب بتظبط إعدادات الشركة تلقائياً — بتوفر وقت كبير في الإعداد الأولي. تقدر تغيّر الإعدادات بعدين من صفحة الإعدادات.</p>
      </div>
    `;

    const currentPreset = currentPresetSlug ? PRESET_INFO[currentPresetSlug] : null;
    let currentHtml = '';
    if (currentPreset) {
      currentHtml = `
        <div class="current-preset">
          <div class="current-preset-icon"><i data-lucide="check-circle"></i></div>
          <div class="current-preset-info">
            <div class="current-preset-label">القالب الحالي</div>
            <div class="current-preset-name">${esc(currentPreset.name)}</div>
            <div class="current-preset-desc">${esc(currentPreset.description)}</div>
          </div>
          <div class="current-preset-check"><i data-lucide="check"></i></div>
        </div>
      `;
    }

    const warningHtml = `
      <div class="warning-box">
        <i data-lucide="alert-triangle"></i>
        <div>
          <strong>⚠️ ملاحظة مهمة</strong>
          تطبيق قالب جديد هيغيّر إعدادات الشركة الأساسية، لكنه <b>مش هيمسح بياناتك</b> (منتجات، فواتير، عملاء). بس ممكن يغيّر بعض الإعدادات الافتراضية.
        </div>
      </div>
    `;

    const infoHtml = `
      <div class="info-box">
        <i data-lucide="info"></i>
        <div>
          <strong>💡 نصيحة</strong>
          اختار القالب الأقرب لطبيعة عملك، وبعدها تقدر تخصص أي إعداد من صفحة الإعدادات.
        </div>
      </div>
    `;

    const cardsHtml = presets.length > 0 ? `
      <div class="presets-grid">
        ${presets.map(p => renderPresetCard(p)).join('')}
      </div>
    ` : `
      <div class="card" style="padding:60px;text-align:center">
        <i data-lucide="inbox" style="width:64px;height:64px;opacity:0.3;margin:0 auto 16px;display:block"></i>
        <h3 style="font-size:16px;font-weight:700;margin-bottom:6px">لا توجد قوالب متاحة</h3>
        <p style="font-size:13px;color:var(--text-muted)">تأكد إن الـ Migration 002 اشتغلت (بتضيف 3 قوالب افتراضية).</p>
      </div>
    `;

    container.innerHTML = heroHtml + currentHtml + warningHtml + infoHtml + cardsHtml;
    bindEvents();
    if (window.lucide) lucide.createIcons();
  }

  function renderPresetCard(p) {
    const info = PRESET_INFO[p.slug] || {
      name: p.name_ar || p.slug,
      description: p.description || '',
      icon: p.icon || 'box',
      class: 'chain',
      features: []
    };
    const isActive = currentPresetSlug === p.slug;

    return `
      <div class="preset-card ${isActive ? 'active' : ''}" data-preset="${esc(p.slug)}">
        <div class="preset-icon ${info.class}">
          <i data-lucide="${esc(info.icon)}"></i>
        </div>
        <div>
          <div class="preset-title">${esc(info.name)}</div>
          <div class="preset-subtitle">${esc(info.description)}</div>
        </div>
        <div class="preset-features">
          ${(info.features || []).map(f => `
            <div class="preset-feature ${f.enabled ? '' : 'disabled'}">
              <div class="preset-feature-icon">
                <i data-lucide="${f.enabled ? 'check' : 'x'}"></i>
              </div>
              <span>${esc(f.label)}</span>
            </div>
          `).join('')}
        </div>
        <button class="preset-apply-btn ${isActive ? 'active' : ''}" data-apply="${esc(p.slug)}" ${isActive ? 'disabled' : ''}>
          <i data-lucide="${isActive ? 'check-circle' : 'zap'}"></i>
          <span>${isActive ? 'القالب الحالي' : 'تطبيق القالب'}</span>
        </button>
      </div>
    `;
  }

  // ═══════════════════════════════════════════════════════════
  // EVENTS
  // ═══════════════════════════════════════════════════════════
  function bindEvents() {
    document.querySelectorAll('[data-apply]').forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const slug = btn.dataset.apply;
        if (slug === currentPresetSlug) return;
        openConfirmModal(slug);
      };
    });

    document.querySelectorAll('.preset-card').forEach(card => {
      card.onclick = (e) => {
        if (e.target.closest('[data-apply]')) return;
        const slug = card.dataset.preset;
        if (slug === currentPresetSlug) return;
        openConfirmModal(slug);
      };
    });
  }

  // ═══════════════════════════════════════════════════════════
  // MODAL
  // ═══════════════════════════════════════════════════════════
  function openConfirmModal(slug) {
    const info = PRESET_INFO[slug] || { name: slug, description: '' };
    pendingApplySlug = slug;

    document.getElementById('confirmBody').innerHTML = `
      <div style="text-align:center;margin-bottom:20px">
        <div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(135deg,var(--accent-soft),var(--purple-soft));display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px">
          <i data-lucide="sparkles" style="width:32px;height:32px;color:var(--accent)"></i>
        </div>
        <h3 style="font-size:18px;font-weight:800;margin-bottom:6px">تطبيق قالب "${esc(info.name)}"</h3>
        <p style="font-size:13px;color:var(--text-muted);line-height:1.7">${esc(info.description)}</p>
      </div>
      <div style="background:var(--bg-soft);border-radius:10px;padding:14px;font-size:12.5px;line-height:1.8">
        <div style="font-weight:800;margin-bottom:8px;color:var(--text)">اللي هيحصل:</div>
        <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px">
          <i data-lucide="check-circle" style="width:14px;height:14px;color:var(--success);flex-shrink:0;margin-top:3px"></i>
          <span>تحديث إعدادات الشركة (POS, مخزون, ضريبة, إلخ)</span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:8px;margin-bottom:6px">
          <i data-lucide="check-circle" style="width:14px;height:14px;color:var(--success);flex-shrink:0;margin-top:3px"></i>
          <span>تفعيل/تعطيل الـ Feature Flags المناسبة</span>
        </div>
        <div style="display:flex;align-items:flex-start;gap:8px">
          <i data-lucide="info" style="width:14px;height:14px;color:var(--info);flex-shrink:0;margin-top:3px"></i>
          <span>مش هيتم مسح أي بيانات (منتجات، فواتير، عملاء)</span>
        </div>
      </div>
    `;

    document.getElementById('confirmModal').classList.add('show');
    if (window.lucide) lucide.createIcons();
  }

  function closeConfirmModal() {
    document.getElementById('confirmModal').classList.remove('show');
    pendingApplySlug = null;
  }

  // ═══════════════════════════════════════════════════════════
  // APPLY PRESET
  // ═══════════════════════════════════════════════════════════
  async function applyPreset(slug) {
    const btn = document.getElementById('applyConfirmBtn');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<div class="spinner sm"></div><span>جاري التطبيق...</span>';

    try {
      // 1) نادي RPC apply_preset_to_company
      const { error: rpcErr } = await sb.rpc('apply_preset_to_company', {
        p_company_id: session.company_id,
        p_preset_slug: slug
      });
      if (rpcErr) throw rpcErr;

      // 2) سجّل الـ preset المطبّق في feature_flags
      const { error: flagErr } = await sb.from('feature_flags').upsert({
        company_id: session.company_id,
        flag_key: 'preset.applied',
        is_enabled: true,
        config: { slug: slug, applied_at: new Date().toISOString(), applied_by: session.user_id }
      }, { onConflict: 'company_id,flag_key' });
      if (flagErr) console.warn('[Presets] Could not save applied preset flag:', flagErr);

      toast('success', 'تم تطبيق القالب بنجاح');
      closeConfirmModal();
      currentPresetSlug = slug;

      // 3) trigger settings reload
      try {
        if (window.RefadSettings) {
          window.RefadSettings.invalidate();
          await window.RefadSettings.load(sb);
        }
        window.dispatchEvent(new CustomEvent('refad:settings-changed', {
          detail: { source: 'preset', slug: slug }
        }));
      } catch (e) { console.warn(e); }

      // 4) أعد الـ render
      setTimeout(() => render(), 500);
    } catch (e) {
      console.error('[Presets] applyPreset:', e);
      toast('error', 'فشل التطبيق: ' + (e.message || ''));
      btn.disabled = false;
      btn.innerHTML = original;
    }
  }

  // ═══════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════
  async function init() {
    session = await (window.Refad && Refad.requireSession ? Refad.requireSession() : Promise.resolve(null));
    if (!session || !session.company_id) {
      setTimeout(() => location.href = 'index.html', 1200);
      return;
    }

    if (window.Refad && Refad.hasPermission) {
      if (!Refad.hasPermission('company.preset_apply') && !Refad.hasPermission('company.edit') && !Refad.hasPermission('settings.edit')) {
        toast('error', 'غير مصرح — صلاحية company.preset_apply مطلوبة');
        setTimeout(() => location.href = 'dashboard.html', 1500);
        return;
      }
    }

    const branchNameEl = document.getElementById('branchName');
    if (branchNameEl) {
      const companyName = (window.RefadSettings && window.RefadSettings.get('general.company_name')) || session.company_name || '';
      branchNameEl.textContent = (companyName || '') + ' — ' + (session.branch_name || '—');
    }

    await render();

    document.getElementById('refreshBtn').onclick = async () => {
      toast('info', 'جاري التحديث...');
      await render();
      toast('success', 'تم التحديث');
    };

    document.getElementById('closeConfirmBtn').onclick = closeConfirmModal;
    document.getElementById('cancelConfirmBtn').onclick = closeConfirmModal;
    document.getElementById('confirmModal').onclick = (e) => {
      if (e.target.id === 'confirmModal') closeConfirmModal();
    };
    document.getElementById('applyConfirmBtn').onclick = () => {
      if (pendingApplySlug) applyPreset(pendingApplySlug);
    };

    if (window.lucide) lucide.createIcons();
    console.log('[Presets v1.0] Ready. Presets:', presets.length, '| Current:', currentPresetSlug || 'NONE');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();
</script>

<script src="sidebar.js"></script>

</body>
