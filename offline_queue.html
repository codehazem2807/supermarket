<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B2C4D">
<title>العمليات المعلقة — رفاد</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="logo.png">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<script src="config.js"></script>
<script src="theme-manager.js"></script>
<script src="settings-manager.js"></script>
<script src="app.js"></script>
<script src="theme.js"></script>

<style>
:root {
  --primary:#0B2C4D; --primary-light:#1e4a73; --primary-dark:#061a2e;
  --accent:#14B8A6; --accent-dark:#0d9488; --accent-soft:rgba(20,184,166,0.1);
  --gold:#F59E0B; --gold-soft:rgba(245,158,11,0.1);
  --danger:#ef4444; --danger-soft:rgba(239,68,68,0.1);
  --success:#10b981; --success-soft:rgba(16,185,129,0.1);
  --info:#3b82f6; --info-soft:rgba(59,130,246,0.1);
  --purple:#8b5cf6; --purple-soft:rgba(139,92,246,0.1);
  --bg:#F1F5F9; --bg-soft:#f8fafc; --bg-card:#ffffff;
  --card:#ffffff; --text:#0f172a; --text-muted:#64748b;
  --border:#e2e8f0; --border-soft:#f1f5f9;
  --radius:14px; --radius-sm:10px; --radius-xs:8px;
  --shadow-xs:0 1px 2px rgba(0,0,0,0.04);
  --shadow:0 4px 20px rgba(11,44,77,0.08);
  --shadow-lg:0 10px 40px rgba(11,44,77,0.12);
  --font-family:'Segoe UI','Cairo',Tahoma,sans-serif;
}
[data-theme="dark"]{--bg:#0f172a;--bg-soft:#1e293b;--bg-card:#1e293b;--card:#1e293b;--text:#f1f5f9;--text-muted:#94a3b8;--border:#334155;--border-soft:#1e293b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{font-family:var(--font-family);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer}input,select,textarea{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

.main{min-height:100vh}
.topbar{height:64px;background:var(--card);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:var(--shadow-xs);gap:12px;flex-wrap:wrap}
.topbar-left{display:flex;align-items:center;gap:12px;min-width:0}
.topbar h1{font-size:19px;font-weight:800;white-space:nowrap}
.topbar-subtitle{font-size:12px;color:var(--text-muted);margin-top:2px}
.topbar-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.connection-status{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap}
.connection-status.online{background:var(--success-soft);color:var(--success)}
.connection-status.offline{background:var(--danger-soft);color:var(--danger);animation:pulse-red 2s infinite}
.connection-status svg{width:14px;height:14px}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0.4)}50%{box-shadow:0 0 0 8px rgba(239,68,68,0)}}

.btn{padding:10px 16px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;border:none;display:inline-flex;align-items:center;gap:8px;transition:all .15s;white-space:nowrap;text-decoration:none}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-dark);transform:translateY(-1px);box-shadow:0 4px 12px var(--accent-soft)}
.btn-ghost{background:var(--bg-soft);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{background:var(--bg);border-color:var(--accent)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-danger:hover{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-success:hover{background:#059669;transform:translateY(-1px)}
.btn-sm{padding:7px 12px;font-size:12px}
.btn-icon{padding:9px;width:38px;height:38px;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}

.content{padding:24px;max-width:1200px;margin:0 auto}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.card-title{font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px}
.card-title svg{width:18px;height:18px;color:var(--accent)}
.card-body{padding:20px}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%;background:var(--accent)}
.stat-card.gold::before{background:var(--gold)}
.stat-card.danger::before{background:var(--danger)}
.stat-card.success::before{background:var(--success)}
.stat-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.stat-icon svg{width:18px;height:18px}
.stat-icon.blue{background:var(--info-soft);color:var(--info)}
.stat-icon.gold{background:var(--gold-soft);color:var(--gold)}
.stat-icon.green{background:var(--success-soft);color:var(--success)}
.stat-icon.red{background:var(--danger-soft);color:var(--danger)}
.stat-label{font-size:12px;color:var(--text-muted);font-weight:600;margin-bottom:4px}
.stat-value{font-size:22px;font-weight:800}
.stat-sub{font-size:11px;color:var(--text-muted);margin-top:4px;font-weight:600}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:20px;overflow-x:auto;padding-bottom:0}
.tab{padding:12px 20px;background:none;border:none;border-bottom:3px solid transparent;color:var(--text-muted);font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s;white-space:nowrap;margin-bottom:-2px;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab .count{background:var(--accent-soft);color:var(--accent);padding:2px 8px;border-radius:10px;font-size:11px;font-weight:800}
.tab.active .count{background:var(--accent);color:#fff}

/* Operation Card */
.op-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;position:relative;overflow:hidden;transition:all .15s}
.op-card:hover{box-shadow:var(--shadow)}
.op-card::before{content:'';position:absolute;top:0;right:0;width:4px;height:100%}
.op-card.pending::before{background:var(--gold)}
.op-card.synced::before{background:var(--success)}
.op-card.failed::before{background:var(--danger)}
.op-card.syncing::before{background:var(--info);animation:pulse-info 1.5s infinite}
@keyframes pulse-info{0%,100%{opacity:1}50%{opacity:0.5}}

.op-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.op-id{font-family:monospace;font-size:11px;color:var(--text-muted);font-weight:600}
.op-type{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:6px;font-size:11px;font-weight:800;margin-top:4px}
.op-type.sale{background:var(--success-soft);color:var(--success)}
.op-type.return{background:var(--danger-soft);color:var(--danger)}
.op-type.other{background:var(--bg-soft);color:var(--text-muted)}
.op-status{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:nowrap}
.op-status.pending{background:var(--gold-soft);color:var(--gold)}
.op-status.syncing{background:var(--info-soft);color:var(--info)}
.op-status.synced{background:var(--success-soft);color:var(--success)}
.op-status.failed{background:var(--danger-soft);color:var(--danger)}
.op-status svg{width:12px;height:12px}

.op-details{background:var(--bg-soft);border-radius:8px;padding:12px;margin-bottom:12px;font-size:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.op-detail{display:flex;flex-direction:column;gap:2px}
.op-detail-label{font-size:10.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.5px}
.op-detail-value{font-size:13px;font-weight:700;color:var(--text)}
.op-detail-value.money{color:var(--accent);font-variant-numeric:tabular-nums}
.op-detail-value.danger{color:var(--danger)}

.op-error{background:var(--danger-soft);color:var(--danger);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:11.5px;font-family:monospace;word-break:break-word;display:flex;gap:8px;align-items:flex-start}
.op-error svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}

.op-actions{display:flex;gap:6px;flex-wrap:wrap}
.op-actions button{padding:7px 12px;font-size:11.5px;font-weight:700;border-radius:6px;border:none;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:4px}
.op-actions button svg{width:12px;height:12px}
.op-actions .retry-btn{background:var(--info-soft);color:var(--info)}
.op-actions .retry-btn:hover{background:var(--info);color:#fff}
.op-actions .delete-btn{background:var(--danger-soft);color:var(--danger)}
.op-actions .delete-btn:hover{background:var(--danger);color:#fff}
.op-actions .view-btn{background:var(--bg-soft);color:var(--text-muted);border:1px solid var(--border)}
.op-actions .view-btn:hover{background:var(--bg);color:var(--text)}

.empty-state{padding:60px 20px;text-align:center;color:var(--text-muted)}
.empty-state svg{width:64px;height:64px;margin-bottom:16px;opacity:.3}
.empty-state h3{font-size:16px;color:var(--text);margin-bottom:6px;font-weight:700}
.empty-state p{font-size:13px;max-width:500px;margin:0 auto;line-height:1.6}

.loading-state{padding:60px;text-align:center;color:var(--text-muted)}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 12px}
.spinner.sm{width:16px;height:16px;border-width:2px;margin:0}
@keyframes spin{to{transform:rotate(360deg)}}

.toast-container{position:fixed;top:20px;left:20px;z-index:3000;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--card);border:1px solid var(--border);border-right:4px solid var(--accent);padding:14px 18px;border-radius:var(--radius-sm);font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:10px;box-shadow:var(--shadow-lg);max-width:400px;animation:slideInToast .3s ease-out}
.toast svg{width:18px;height:18px;flex-shrink:0}
.toast.success{border-right-color:var(--success)}.toast.success svg{color:var(--success)}
.toast.error{border-right-color:var(--danger)}.toast.error svg{color:var(--danger)}
.toast.info{border-right-color:var(--info)}.toast.info svg{color:var(--info)}
.toast.warning{border-right-color:var(--gold)}.toast.warning svg{color:var(--gold)}
@keyframes slideInToast{from{opacity:0;transform:translateX(-20px)}to{opacity:1;transform:translateX(0)}}

@media (max-width:768px){
  .content{padding:16px}
  .topbar{padding:0 16px}
  .topbar h1{font-size:16px}
  .stats-grid{grid-template-columns:1fr 1fr}
  .op-details{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div id="refad-sidebar"></div>

<main class="main">
  <div class="topbar">
    <div class="topbar-left">
      <div>
        <h1>العمليات المعلقة</h1>
        <div class="topbar-subtitle" id="branchName">—</div>
      </div>
    </div>
    <div class="topbar-actions">
      <span class="connection-status online" id="connectionStatus">
        <i data-lucide="wifi"></i>
        <span>متصل</span>
      </span>
      <button class="btn btn-ghost btn-icon" id="refreshBtn" title="تحديث"><i data-lucide="refresh-cw"></i></button>
      <button class="btn btn-primary" id="syncAllBtn">
        <i data-lucide="cloud-upload"></i>
        مزامنة الكل
      </button>
    </div>
  </div>

  <div class="content" id="mainContent">
    <div class="loading-state"><div class="spinner"></div>جاري التحميل...</div>
  </div>
</main>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
  'use strict';

  const cfg = window.REFAD_CONFIG;
  const sb = (window.Refad && window.Refad.sb) || window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  let session = null;
  let allOps = [];
  let filteredOps = [];
  let currentTab = 'pending';
  let isOnline = navigator.onLine;

  const OFFLINE_QUEUE_KEY = 'refad_offline_queue_v1';

  const esc = (window.Refad && Refad.esc) || function(s){return s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
  const money = (window.Refad && Refad.money) || function(v){return Number(v||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2})+' ج.م'};
  const fmtDate = (window.Refad && Refad.fmtDate) || function(d){if(!d)return'—';return new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'})};
  const fmtDateTime = (window.Refad && Refad.fmtDateTime) || function(d){if(!d)return'—';return new Date(d).toLocaleString('ar-EG',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})};
  const toast = (function(){
    const base = window.Refad && Refad.toast;
    if (base && typeof base === 'object') return function(t,m){(base[t]||base.info||function(){}) (m);};
    if (typeof base === 'function') return base;
    return function(type, msg) {
      const icons = {error:'alert-circle',success:'check-circle',info:'info',warning:'alert-triangle'};
      const el = document.createElement('div');
      el.className = 'toast ' + type;
      el.innerHTML = '<i data-lucide="' + (icons[type]||'info') + '"></i><span>' + esc(msg) + '</span>';
      const c = document.getElementById('toastContainer');
      if (c) { c.appendChild(el); if (window.lucide) lucide.createIcons();
        setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity 0.3s';setTimeout(()=>el.remove(),300)},3000); }
    };
  })();

  // ═══════════════════════════════════════════════════════════
  // LOAD
  // ═══════════════════════════════════════════════════════════
  function loadOfflineQueue() {
    try {
      const raw = localStorage.getItem(OFFLINE_QUEUE_KEY);
      allOps = raw ? JSON.parse(raw) : [];
      console.log('[OfflineQueue] Loaded', allOps.length, 'operations');
    } catch (e) {
      console.error('[OfflineQueue] load error:', e);
      allOps = [];
    }
  }

  function saveOfflineQueue() {
    try {
      localStorage.setItem(OFFLINE_QUEUE_KEY, JSON.stringify(allOps));
    } catch (e) {
      console.error('[OfflineQueue] save error:', e);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // STATS
  // ═══════════════════════════════════════════════════════════
  function computeStats() {
    const pending = allOps.filter(o => o.status === 'pending').length;
    const syncing = allOps.filter(o => o.status === 'syncing').length;
    const failed = allOps.filter(o => o.status === 'failed').length;
    const synced = allOps.filter(o => o.status === 'synced').length;

    // إجمالي المبالغ المعلقة
    let pendingAmount = 0;
    allOps.forEach(o => {
      if (o.status === 'pending' || o.status === 'failed') {
        if (o.payload && o.payload.p_paid) pendingAmount += Number(o.payload.p_paid) || 0;
      }
    });

    return { total: allOps.length, pending, syncing, failed, synced, pendingAmount };
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER
  // ═══════════════════════════════════════════════════════════
  async function render() {
    const container = document.getElementById('mainContent');
    loadOfflineQueue();
    const stats = computeStats();

    // Tab counts
    const tabCounts = {
      pending: stats.pending,
      syncing: stats.syncing,
      failed: stats.failed,
      synced: stats.synced,
      all: stats.total
    };

    // Filter حسب الـ tab
    if (currentTab === 'all') {
      filteredOps = allOps.slice();
    } else {
      filteredOps = allOps.filter(o => o.status === currentTab);
    }

    // ترتيب حسب created_at (الأحدث أولاً)
    filteredOps.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

    const statsHtml = `
      <div class="stats-grid">
        <div class="stat-card gold">
          <div class="stat-icon gold"><i data-lucide="clock"></i></div>
          <div class="stat-label">بانتظار المزامنة</div>
          <div class="stat-value" style="color:var(--gold)">${stats.pending}</div>
          <div class="stat-sub">${stats.pendingAmount > 0 ? money(stats.pendingAmount) : '—'}</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon blue"><i data-lucide="loader"></i></div>
          <div class="stat-label">جاري المزامنة</div>
          <div class="stat-value" style="color:var(--info)">${stats.syncing}</div>
          <div class="stat-sub">—</div>
        </div>
        <div class="stat-card danger">
          <div class="stat-icon red"><i data-lucide="alert-triangle"></i></div>
          <div class="stat-label">فشلت</div>
          <div class="stat-value" style="color:var(--danger)">${stats.failed}</div>
          <div class="stat-sub">تحتاج تدخل</div>
        </div>
        <div class="stat-card success">
          <div class="stat-icon green"><i data-lucide="check-circle"></i></div>
          <div class="stat-label">تمت المزامنة</div>
          <div class="stat-value" style="color:var(--success)">${stats.synced}</div>
          <div class="stat-sub">—</div>
        </div>
      </div>
    `;

    const tabsHtml = `
      <div class="tabs">
        <button class="tab ${currentTab === 'pending' ? 'active' : ''}" data-tab="pending">
          <i data-lucide="clock" style="width:14px;height:14px"></i>
          بانتظار
          ${tabCounts.pending > 0 ? `<span class="count">${tabCounts.pending}</span>` : ''}
        </button>
        <button class="tab ${currentTab === 'failed' ? 'active' : ''}" data-tab="failed">
          <i data-lucide="alert-triangle" style="width:14px;height:14px"></i>
          فشلت
          ${tabCounts.failed > 0 ? `<span class="count">${tabCounts.failed}</span>` : ''}
        </button>
        <button class="tab ${currentTab === 'synced' ? 'active' : ''}" data-tab="synced">
          <i data-lucide="check-circle" style="width:14px;height:14px"></i>
          تمت المزامنة
          ${tabCounts.synced > 0 ? `<span class="count">${tabCounts.synced}</span>` : ''}
        </button>
        <button class="tab ${currentTab === 'all' ? 'active' : ''}" data-tab="all">
          <i data-lucide="list" style="width:14px;height:14px"></i>
          الكل
          <span class="count">${tabCounts.all}</span>
        </button>
      </div>
    `;

    let contentHtml = '';
    if (allOps.length === 0) {
      contentHtml = `
        <div class="card">
          <div class="empty-state">
            <i data-lucide="inbox"></i>
            <h3>لا توجد عمليات معلقة</h3>
            <p>كل العمليات تمت مزامنتها بنجاح ✅<br>لو حصل انقطاع في الاتصال، العمليات اللي بتتم offline هتظهر هنا.</p>
          </div>
        </div>
      `;
    } else if (filteredOps.length === 0) {
      contentHtml = `
        <div class="card">
          <div class="empty-state">
            <i data-lucide="search"></i>
            <h3>لا توجد عمليات في هذا التبويب</h3>
            <p>جرّب تبويب آخر لعرض العمليات.</p>
          </div>
        </div>
      `;
    } else {
      contentHtml = filteredOps.map(op => renderOpCard(op)).join('');
    }

    container.innerHTML = statsHtml + tabsHtml + contentHtml;
    bindEvents();
    if (window.lucide) lucide.createIcons();
  }

  function renderOpCard(op) {
    const typeMap = {
      sale: { label: 'فاتورة بيع', icon: 'shopping-cart', class: 'sale' },
      return: { label: 'مرتجع', icon: 'rotate-ccw', class: 'return' },
      session_open: { label: 'فتح وردية', icon: 'play-circle', class: 'other' },
      session_close: { label: 'إغلاق وردية', icon: 'stop-circle', class: 'other' },
      stock_adjust: { label: 'تعديل مخزون', icon: 'package', class: 'other' }
    };

    const statusMap = {
      pending: { label: 'بانتظار', icon: 'clock' },
      syncing: { label: 'جاري المزامنة', icon: 'loader' },
      synced: { label: 'تمت', icon: 'check-circle' },
      failed: { label: 'فشلت', icon: 'x-circle' }
    };

    const typeInfo = typeMap[op.type] || { label: op.type, icon: 'circle', class: 'other' };
    const statusInfo = statusMap[op.status] || { label: op.status, icon: 'circle' };

    const payload = op.payload || {};
    const total = payload.p_paid ? money(payload.p_paid) : '—';
    const itemsCount = Array.isArray(payload.p_items) ? payload.p_items.length : 0;
    const method = payload.p_method || '—';
    const methodLabel = { cash: 'نقدي', card: 'بطاقة', credit: 'آجل', mixed: 'مختلط', wallet: 'محفظة', bank: 'بنكي' }[method] || method;

    const isOffline = !isOnline;
    const canRetry = op.status === 'pending' || op.status === 'failed';

    return `
      <div class="op-card ${op.status}">
        <div class="op-header">
          <div>
            <span class="op-type ${typeInfo.class}">
              <i data-lucide="${typeInfo.icon}" style="width:12px;height:12px"></i>
              ${typeInfo.label}
            </span>
            <div class="op-id">${esc(op.id)}</div>
          </div>
          <div class="op-status ${op.status}">
            <i data-lucide="${statusInfo.icon}" style="width:12px;height:12px"></i>
            ${statusInfo.label}
          </div>
        </div>

        <div class="op-details">
          <div class="op-detail">
            <div class="op-detail-label">وقت الإنشاء</div>
            <div class="op-detail-value">${fmtDateTime(op.created_at)}</div>
          </div>
          <div class="op-detail">
            <div class="op-detail-label">المبلغ</div>
            <div class="op-detail-value money">${total}</div>
          </div>
          <div class="op-detail">
            <div class="op-detail-label">طريقة الدفع</div>
            <div class="op-detail-value">${methodLabel}</div>
          </div>
          <div class="op-detail">
            <div class="op-detail-label">عدد الأصناف</div>
            <div class="op-detail-value">${itemsCount}</div>
          </div>
          ${op.retry > 0 ? `
            <div class="op-detail">
              <div class="op-detail-label">عدد المحاولات</div>
              <div class="op-detail-value ${op.retry >= 5 ? 'danger' : ''}">${op.retry}</div>
            </div>
          ` : ''}
          ${op.synced_at ? `
            <div class="op-detail">
              <div class="op-detail-label">وقت المزامنة</div>
              <div class="op-detail-value">${fmtDateTime(op.synced_at)}</div>
            </div>
          ` : ''}
        </div>

        ${op.error ? `
          <div class="op-error">
            <i data-lucide="alert-circle"></i>
            <div>${esc(op.error)}</div>
          </div>
        ` : ''}

        <div class="op-actions">
          ${canRetry ? `
            <button class="retry-btn" data-retry="${esc(op.id)}" ${isOffline ? 'disabled' : ''}>
              <i data-lucide="rotate-cw"></i>
              ${isOffline ? 'بحاجة لإنترنت' : 'إعادة المحاولة'}
            </button>
          ` : ''}
          <button class="delete-btn" data-delete="${esc(op.id)}">
            <i data-lucide="trash-2"></i>
            حذف
          </button>
        </div>
      </div>
    `;
  }

  // ═══════════════════════════════════════════════════════════
  // EVENTS
  // ═══════════════════════════════════════════════════════════
  function bindEvents() {
    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.onclick = () => {
        currentTab = tab.dataset.tab;
        render();
      };
    });

    // Retry buttons
    document.querySelectorAll('[data-retry]').forEach(btn => {
      btn.onclick = () => retryOperation(btn.dataset.retry);
    });

    // Delete buttons
    document.querySelectorAll('[data-delete]').forEach(btn => {
      btn.onclick = () => deleteOperation(btn.dataset.delete);
    });
  }

  // ═══════════════════════════════════════════════════════════
  // ACTIONS
  // ═══════════════════════════════════════════════════════════
  async function retryOperation(opId) {
    if (!isOnline) {
      toast('error', 'لا يوجد اتصال بالإنترنت');
      return;
    }

    const op = allOps.find(o => o.id === opId);
    if (!op) return;

    try {
      op.status = 'syncing';
      saveOfflineQueue();
      await render();

      if (op.type === 'sale') {
        const r = await sb.rpc('record_invoice_v3', op.payload);
        if (r.error) throw r.error;
      } else {
        throw new Error('نوع العملية غير مدعوم: ' + op.type);
      }

      op.status = 'synced';
      op.synced_at = new Date().toISOString();
      op.retry = (op.retry || 0) + 1;
      saveOfflineQueue();
      toast('success', 'تمت المزامنة بنجاح');
      await render();
    } catch (e) {
      op.status = 'failed';
      op.retry = (op.retry || 0) + 1;
      op.error = e.message || String(e);
      saveOfflineQueue();
      toast('error', 'فشل: ' + (e.message || ''));
      await render();
    }
  }

  async function deleteOperation(opId) {
    if (!confirm('حذف هذه العملية نهائياً؟')) return;
    allOps = allOps.filter(o => o.id !== opId);
    saveOfflineQueue();
    toast('success', 'تم حذف العملية');
    await render();
  }

  async function syncAll() {
    if (!isOnline) {
      toast('error', 'لا يوجد اتصال بالإنترنت');
      return;
    }

    const pending = allOps.filter(o => o.status === 'pending' || o.status === 'failed');
    if (pending.length === 0) {
      toast('info', 'لا توجد عمليات للمزامنة');
      return;
    }

    const btn = document.getElementById('syncAllBtn');
    btn.disabled = true;
    const original = btn.innerHTML;
    btn.innerHTML = '<div class="spinner sm"></div><span>جاري المزامنة...</span>';

    let successCount = 0;
    let failCount = 0;

    for (const op of pending) {
      try {
        op.status = 'syncing';
        saveOfflineQueue();
        await render();

        if (op.type === 'sale') {
          const r = await sb.rpc('record_invoice_v3', op.payload);
          if (r.error) throw r.error;
        } else {
          throw new Error('نوع غير مدعوم');
        }

        op.status = 'synced';
        op.synced_at = new Date().toISOString();
        successCount++;
      } catch (e) {
        op.status = 'failed';
        op.retry = (op.retry || 0) + 1;
        op.error = e.message || String(e);
        failCount++;
      }
      saveOfflineQueue();
    }

    await render();
    btn.disabled = false;
    btn.innerHTML = original;
    if (window.lucide) lucide.createIcons();

    if (failCount === 0) {
      toast('success', 'تمت مزامنة ' + successCount + ' عملية بنجاح');
    } else {
      toast('warning', 'نجح ' + successCount + ' وفشل ' + failCount);
    }
  }

  // ═══════════════════════════════════════════════════════════
  // CONNECTION STATUS
  // ═══════════════════════════════════════════════════════════
  function updateConnectionStatus() {
    const statusEl = document.getElementById('connectionStatus');
    if (!statusEl) return;
    if (isOnline) {
      statusEl.className = 'connection-status online';
      statusEl.innerHTML = '<i data-lucide="wifi"></i><span>متصل</span>';
    } else {
      statusEl.className = 'connection-status offline';
      statusEl.innerHTML = '<i data-lucide="wifi-off"></i><span>غير متصل</span>';
    }
    if (window.lucide) lucide.createIcons();
  }

  window.addEventListener('online', () => {
    isOnline = true;
    updateConnectionStatus();
    toast('success', 'تم استعادة الاتصال');
    render();
  });

  window.addEventListener('offline', () => {
    isOnline = false;
    updateConnectionStatus();
    toast('warning', 'انقطع الاتصال');
    render();
  });

  // ═══════════════════════════════════════════════════════════
  // INIT
  // ═══════════════════════════════════════════════════════════
  async function init() {
    session = await (window.Refad && Refad.requireSession ? Refad.requireSession() : Promise.resolve(null));
    if (!session || !session.company_id) {
      setTimeout(() => location.href = 'index.html', 1200);
      return;
    }

    if (window.Refad && Refad.hasPermission) {
      if (!Refad.hasPermission('offline_queue.view') && !Refad.hasPermission('pos.use') && !Refad.hasPermission('settings.view')) {
        toast('error', 'غير مصرح — صلاحية offline_queue.view مطلوبة');
        setTimeout(() => location.href = 'dashboard.html', 1500);
        return;
      }
    }

    const branchNameEl = document.getElementById('branchName');
    if (branchNameEl) {
      const companyName = (window.RefadSettings && window.RefadSettings.get('general.company_name')) || session.company_name || '';
      branchNameEl.textContent = (companyName || '') + ' — ' + (session.branch_name || '—');
    }

    updateConnectionStatus();
    await render();

    document.getElementById('refreshBtn').onclick = async () => {
      toast('info', 'جاري التحديث...');
      await render();
      toast('success', 'تم التحديث');
    };

    document.getElementById('syncAllBtn').onclick = syncAll;

    if (window.lucide) lucide.createIcons();
    console.log('[OfflineQueue v1.0] Ready. Total ops:', allOps.length);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();

})();
</script>
